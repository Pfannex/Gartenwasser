# Lovelace-Dashboard (YAML-Modus) - Nachbau der WebIF-Navigation (7 Tabs, docs/manual/
# images/webif-status.webp) + Programme-Auswahl (Phase 10.1/10.3).
# Einbindung: Einstellungen -> Dashboards -> "+ Dashboard hinzufuegen" -> "Neues Dashboard
# aus YAML erstellen", diesen Inhalt einfuegen. Alternativ ueber configuration.yaml als
# YAML-Dashboard registrieren (lovelace.dashboards, url_path braucht einen Bindestrich!).
#
# Entity-IDs unten sind aus der ECHTEN Entity-Registry einer laufenden Instanz uebernommen
# (core.entity_registry), nicht nur aus den HaDiscovery.cpp-"name"-Feldern geraten - Home
# Assistant haengt bei Discovery-Entities automatisch den Geraetenamen als Praefix an
# (z. B. "Ventil 1" -> switch.gartenbewasserung_ventil_1). Trotzdem vor Verwendung gegen
# die eigene Instanz pruefen (Einstellungen -> Geraete & Dienste -> Entitaeten) - bei
# Namenskollisionen kann HA einen abweichenden Suffix ("_2") vergeben.
#
# Bekannte Luecke: WebIF-Ventil-Aliase (z. B. "Sprenger Rasen") sind NICHT ueber MQTT/
# Discovery verfuegbar (kein Topic dafuer) - das Dashboard zeigt daher "Ventil 1" statt
# des Alias. Wer die Aliase im Dashboard sehen will, muss sie manuell in customize.yaml
# als friendly_name je Entity eintragen und bei Aenderung im WebIF von Hand nachpflegen.
#
# Abhaengigkeiten: die Status-View nutzt "custom:mushroom-template-card" (HACS-Repository
# piitaya/lovelace-mushroom) fuer die Start/Stop-Kachel - reine Bordmittel (tile/markdown)
# konnten weder mehrere Entities in einer Box kombinieren noch farbig gestylte Boxen
# rendern (Markdown-Karte filtert Inline-style per DOMPurify raus). Details/Rationale
# siehe README.md, Abschnitt "Abhaengigkeiten".

title: Gartenwasser
views:
  - title: Status
    path: gartenwasser-status
    icon: mdi:sprinkler-variant
    show_icon_and_title: true
    type: sections
    sections:
      - type: grid
        cards:
          - type: custom:stack-in-card
            grid_options:
              columns: full
            cards:
              - type: custom:stack-in-card
                mode: horizontal
                cards:
                  - type: custom:mushroom-template-card
                    entity: switch.gartenbewasserung_automatik_sequenz
                    primary: "{{ 'STOP' if is_state('switch.gartenbewasserung_automatik_sequenz', 'on') else 'START' }}"
                    icon: "{{ 'mdi:stop' if is_state('switch.gartenbewasserung_automatik_sequenz', 'on') else 'mdi:play' }}"
                    icon_color: "{{ 'red' if is_state('switch.gartenbewasserung_automatik_sequenz', 'on') else 'green' }}"
                    layout: vertical
                    tap_action:
                      action: toggle
                    card_mod:
                      style:
                        ha-tile-icon$: |
                          .container {
                            width: 96px !important;
                            height: 96px !important;
                            border-radius: 50% !important;
                          }
                        .: |
                          ha-tile-icon {
                            --mdc-icon-size: 64px !important;
                          }

                  - type: custom:mushroom-template-card
                    primary: Aktives Programm
                    secondary: "{{ states('input_select.gartenwasser_programm') }}"
                    icon: mdi:playlist-check
                    layout: horizontal
                    # Bewusst rein informativ, kein tap_action: sowohl die entities-Karte
                    # (fruehere Version) als auch mushroom-select-card (Zwischenversion)
                    # oeffneten bei Klick einen Dialog/eigenes Fenster - vom Nutzer explizit
                    # abgelehnt (siehe Log.md). Programm-Wechsel bleibt vorerst WebIF/Touch.
                    # Platzhalter: "Naechster Termin" (siehe WebIF-Vorbild) folgt in einem
                    # spaeteren Schritt, sobald Zeitplan-Daten per MQTT verfuegbar sind.

              - type: custom:timer-bar-card
                entity: switch.gartenbewasserung_automatik_sequenz
                active_state: "on"
                duration:
                  entity: sensor.gartenwasser_gesamtlaufzeit
                  units: minutes
                layout: hide_name
                icon: mdi:clock-outline
                bar_height: 10px
                sync_issues: fix
                tap_action:
                  action: none
                visibility:
                  - condition: state
                    entity: switch.gartenbewasserung_automatik_sequenz
                    state: "on"
                # BEWUSST kein remain_time (main/remainingTotal): timer-bar-card hat einen
                # bekannten, ungefixten Upstream-Bug (rianadon/timer-bar-card#244) - wenn die
                # Karte einmal in dem kurzen Fenster rendert, bevor die erste frische
                # MQTT-Nachricht ankommt (remain_time kurzzeitig "unknown"), bleibt sie
                # dauerhaft haengen (nur Icon+Text, kein Balken) und erholt sich NICHT von
                # selbst, auch wenn die Daten danach laengst gueltig sind - nur ein
                # Seiten-Reload hilft, was der Nutzer explizit abgelehnt hat. Stattdessen wie
                # bei den Ventil-Balken rein aus Uhrzeit + duration selbst berechnet - kein
                # Abhaengigkeit von einer Quelle, die je "unknown" sein kann, damit tritt der
                # Bug erst gar nicht auf. visibility oben blendet die Karte ausserdem im
                # Ruhezustand komplett aus.

          # War vorher ein "type: markdown"-Card mit <div style="..."> als Pseudo-Grid -
          # gerendert hat HA daraus nur rohen Text (DOMPurify filtert Inline-style/divs in
          # Markdown-Karten komplett raus, siehe Log.md). Erst durch eine schlichte
          # entities-Karte ersetzt, jetzt auf mushroom-template-card umgestellt (bereits
          # verifiziert funktionstuechtig beim Start/Programm-Element) - damit lassen sich
          # Alias-Name + dynamische Laufzeit/Restlaufzeit + Automatik-Faerbung abbilden, was
          # eine reine entities-Karte nicht kann.
          - type: custom:stack-in-card
            grid_options:
              columns: 6
            cards:
              - type: markdown
                content: "## Ventile"

              - type: custom:mushroom-template-card
                primary: "{{ states('text.gartenwasser_v0_alias') }}"
                secondary: "{{ 'An' if is_state('binary_sensor.gartenbewasserung_hauptventil', 'on') else 'Aus' }}"
                icon: mdi:valve
                icon_color: "{{ 'red' if is_state('binary_sensor.gartenbewasserung_hauptventil', 'on') else 'green' }}"
                layout: horizontal

              - type: custom:stack-in-card
                mode: horizontal
                cards:
                  - type: custom:mushroom-template-card
                    entity: switch.gartenbewasserung_ventil_1
                    primary: "{{ states('text.gartenwasser_v1_alias') }}"
                    secondary: >-
                      {% if is_state('switch.gartenbewasserung_ventil_1', 'on') %}
                        {{ states('sensor.gartenbewasserung_ventil_1_restlaufzeit') }} min
                      {% else %}
                        {{ states('number.gartenbewasserung_ventil_1_laufzeit') }} min
                      {% endif %}
                    icon: mdi:sprinkler-variant
                    icon_color: >-
                      {% if is_state('switch.gartenbewasserung_ventil_1', 'on') %}
                        red
                      {% elif is_state('binary_sensor.gartenbewasserung_ventil_1_automatik', 'on') %}
                        green
                      {% else %}
                        grey
                      {% endif %}
                    layout: horizontal
                    tap_action:
                      action: toggle

                  - type: custom:timer-bar-card
                    entity: switch.gartenbewasserung_ventil_1
                    active_state: "on"
                    duration:
                      entity: number.gartenbewasserung_ventil_1_laufzeit
                      units: minutes
                    layout: hide_name
                    icon: mdi:clock-outline
                    bar_height: 10px
                    sync_issues: fix
                    tap_action:
                      action: none
                    visibility:
                      - condition: state
                        entity: switch.gartenbewasserung_ventil_1
                        state: "on"

              - type: custom:stack-in-card
                mode: horizontal
                cards:
                  - type: custom:mushroom-template-card
                    entity: switch.gartenbewasserung_ventil_2
                    primary: "{{ states('text.gartenwasser_v2_alias') }}"
                    secondary: >-
                      {% if is_state('switch.gartenbewasserung_ventil_2', 'on') %}

                entity_id: switch.gartenbewasserung_automatik_sequenz
            styles: |
              .bubble-main-icon-container ha-icon {
                color: ${hass.states['switch.gartenbewasserung_automatik_sequenz'].state === 'on' ? 'red' : 'green'} !important;
              }
              ${card.querySelector('.bubble-main-icon-container ha-icon').setAttribute('icon', hass.states['switch.gartenbewasserung_automatik_sequenz'].state === 'on' ? 'mdi:stop' : 'mdi:play')}
              ${card.querySelector('.bubble-name').textContent = hass.states['switch.gartenbewasserung_automatik_sequenz'].state === 'on' ? 'STOP' : 'START'}
              ${(() => {
                const el = card.querySelector('.bubble-state');
                el.classList.remove('hidden');
                el.style.display = '';
                const sw = hass.states['switch.gartenbewasserung_automatik_sequenz'];
                if (sw.state === 'on') {
                  const durSec = (parseFloat(hass.states['sensor.gartenwasser_gesamtlaufzeit'].state) || 0) * 60;
                  const elapsedSec = (Date.now() - new Date(sw.last_changed).getTime()) / 1000;
                  const remainingSec = Math.max(0, Math.round(durSec - elapsedSec));
                  const mm = Math.floor(remainingSec / 60);
                  const ss = remainingSec % 60;
                  el.textContent = mm + ':' + String(ss).padStart(2, '0');
                } else {
                  el.textContent = hass.states['input_select.gartenwasser_programm'].state;
                }
              })()}


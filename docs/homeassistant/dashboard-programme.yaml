                    visibility:
                      - condition: state
                        entity: switch.gartenbewasserung_ventil_3
                        state: "on"

              - type: custom:stack-in-card
                mode: horizontal
                cards:
                  - type: custom:mushroom-template-card
                    entity: switch.gartenbewasserung_ventil_4
                    primary: "{{ states('text.gartenwasser_v4_alias') }}"
                    secondary: >-
                      {% if is_state('switch.gartenbewasserung_ventil_4', 'on') %}
                        {{ states('sensor.gartenbewasserung_ventil_4_restlaufzeit') }} min
                      {% else %}
                        {{ states('number.gartenbewasserung_ventil_4_laufzeit') }} min
                      {% endif %}
                    icon: mdi:sprinkler-variant
                    icon_color: >-
                      {% if is_state('switch.gartenbewasserung_ventil_4', 'on') %}
                        red
                      {% elif is_state('binary_sensor.gartenbewasserung_ventil_4_automatik', 'on') %}
                        green
                      {% else %}
                        grey
                      {% endif %}
                    layout: horizontal
                    tap_action:
                      action: toggle

                  - type: custom:timer-bar-card
                    entity: switch.gartenbewasserung_ventil_4
                    active_state: "on"
                    duration:
                      entity: number.gartenbewasserung_ventil_4_laufzeit
                      units: minutes
                    layout: hide_name
                    icon: mdi:clock-outline
                    bar_height: 10px
                    sync_issues: fix

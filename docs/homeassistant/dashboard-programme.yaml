                      - condition: state
                        entity: switch.gartenbewasserung_ventil_4
                        state: "on"

              - type: custom:stack-in-card
                mode: horizontal
                cards:
                  - type: custom:mushroom-template-card
                    entity: switch.gartenbewasserung_ventil_5
                    primary: "{{ states('text.gartenwasser_v5_alias') }}"
                    secondary: >-
                      {% if is_state('switch.gartenbewasserung_ventil_5', 'on') %}

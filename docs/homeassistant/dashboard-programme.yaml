                if (!sliderCol) {
                  sliderCol = document.createElement('div');
                  sliderCol.className = 'slider-col';
                  sliderCol.style.cssText = 'flex:0 0 210px; pointer-events:auto; display:flex; flex-direction:column; gap:5px;';
                  sliderCol.innerHTML = `
                    <style>.v1-slider-range::-webkit-slider-thumb{-webkit-appearance:none;width:0;height:36px;}
                    .v1-slider-range::-moz-range-thumb{width:0;height:36px;border:none;background:transparent;}</style>

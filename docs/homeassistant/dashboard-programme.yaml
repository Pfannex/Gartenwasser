          # das Copyright sind bewusst statischer Text (kein passendes MQTT-Topic dafuer),
          # nur die Firmware-Version in der Mitte ist live aus diagnostics/version.
          - type: markdown
            content: >-
              Gartenbewässerung&nbsp;&nbsp;&nbsp;|&nbsp;&nbsp;&nbsp;{{
              states('sensor.gartenwasser_firmware') }}&nbsp;&nbsp;&nbsp;|&nbsp;&nbsp;&nbsp;©
              by Pfanne/26
            grid_options:
              columns: full
            card_mod:
              style: |
                ha-card {
                  text-align: center;
                }

  - title: Konfiguration
    path: gartenwasser-konfiguration
    icon: mdi:cog-outline
    show_icon_and_title: true
    type: sections
    sections:
      - type: grid
        cards:
          # --- Globale Einstellungen (Bubble Card, siehe Log.md fuer die Mockup-Iteration) ---
          - type: markdown
            content: |
              ##### Globale Einstellungen
              Harte Obergrenze pro Ventil, überschreitet eine Laufzeit dieses Limit, schaltet es automatisch ab.
            grid_options:
              columns: full
            card_mod:
              style:
                .: |
                  ha-card {
                    min-width: 500px;
                    background: transparent !important;
                    box-shadow: none !important;
                    border: none !important;
                  }
                ha-markdown$: |
                  h5 {
                    font-size: 0.78rem;
                    font-weight: 700;
                    text-transform: uppercase;
                    letter-spacing: 0.06em;
                    color: var(--secondary-text-color);
                    margin: 0 0 6px;
                  }
                  p {
                    font-size: 0.78rem;
                    color: var(--secondary-text-color);
                    margin: 0;
                    max-width: 56ch;
                  }
            # h5/p liegen im SHADOW ROOT von <ha-markdown> (eigenes Custom Element, siehe
            # Log.md) - ein normaler card_mod "style: |"-String scoped nur auf ha-card selbst
            # und erreicht diese Tags NICHT. Erst durch die "ha-markdown$:"-Syntax (card_mod
            # piercing) wirkt das CSS tatsaechlich - vorher blieb text-transform etc. wirkungslos.

          - type: custom:bubble-card
            card_type: button
            button_type: name
            entity: number.gartenwasser_max_time
            icon: mdi:clock-outline
            name: "Maximale Laufzeit"
            show_name: false
            show_state: false
            card_mod:
              style: |
                ha-card {
                  min-width: 500px;
                }
            styles: |
              .bubble-wrapper {
                box-sizing: border-box !important;
                padding: 0 8px !important;
                gap: 12px !important;
                align-items: center !important;
              }
              .bubble-buttons-container {
                display: none !important;
              }
              .bubble-main-icon-container {
                width: 36px !important;
                height: 36px !important;
                min-width: 36px !important;
                min-height: 36px !important;
                margin: 0 !important;
              }
              .bubble-main-icon-container ha-icon {
                color: black !important;
                --mdc-icon-size: 20px !important;
              }
              ha-card {
                --row-height: 72px !important;
                --bubble-button-icon-background-color: #607d8b !important;
              }
              ${(() => {
                const nc = card.querySelector('.bubble-name-container');
                let input = nc.querySelector('input.slider-range');
                if (!input) {
                  nc.style.cssText = 'flex:1 1 auto; margin:0; pointer-events:auto; display:flex; flex-direction:column; gap:5px;';
                  nc.innerHTML = `
                    <style>.slider-range::-webkit-slider-thumb{-webkit-appearance:none;width:0;height:36px;}
                    .slider-range::-moz-range-thumb{width:0;height:36px;border:none;background:transparent;}</style>
                    <div style="font-size:0.68rem;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;color:#9aa1ad;">Maximale Laufzeit</div>
                    <div class="slider-field" style="position:relative;height:36px;border-radius:18px;background:#282828;display:flex;align-items:center;overflow:hidden;">
                      <div class="slider-fill" style="position:absolute;left:0;top:0;bottom:0;background:#607d8b;border-radius:18px 0 0 18px;pointer-events:none;"></div>
                      <div class="slider-label" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:0.82rem;font-weight:600;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,0.5);pointer-events:none;z-index:1;font-variant-numeric:tabular-nums;"></div>
                      <input type="range" class="slider-range" min="0" max="180" step="1" style="position:relative;z-index:2;-webkit-appearance:none;appearance:none;width:100%;height:100%;margin:0;background:transparent;cursor:pointer;">
                    </div>`;
                  input = nc.querySelector('input.slider-range');
                  const fill = nc.querySelector('.slider-fill');
                  const label = nc.querySelector('.slider-label');
                  const sync = () => {
                    const pct = (input.value / input.max) * 100;
                    fill.style.width = pct + '%';
                    label.textContent = Math.round(input.value) + ' min';
                  };
                  input.addEventListener('input', sync);
                  input.addEventListener('change', () => {
                    hass.callService('number', 'set_value', { entity_id: 'number.gartenwasser_max_time', value: input.value });
                  });
                  input._sync = sync;
                }
                if (document.activeElement !== input) {
                  input.value = hass.states['number.gartenwasser_max_time'].state;
                }
                input._sync();
              })()}
            # Kein nativer Slider mehr (button_type: name statt slider) - Slider ist ein
            # 1:1-Nachbau des Artifact-Mockups (Label oberhalb, Wert zentriert im Fuellstand,
            # siehe valve-config-mockup.html), analog zum Alias-Textfeld per innerHTML injiziert.

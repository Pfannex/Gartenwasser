  - title: Konfiguration
    path: gartenwasser-konfiguration
    icon: mdi:cog-outline
    show_icon_and_title: true
    type: sections
    sections:
      - type: grid
        cards:
          - type: markdown
            content: "## Globale Einstellungen"
            grid_options:
              columns: full
            card_mod:
              style: |
                ha-card {
                  min-width: 700px;
                }

          - type: entities
            show_header_toggle: false
            grid_options:
              columns: full
            card_mod:
              style: |
                ha-card {
                  min-width: 700px;
                }
            entities:
              - entity: number.gartenwasser_max_time
                name: Maximale Laufzeit
            # main/time/maxTime ist nicht direkt schreibbar - der zugehoerige MQTT-number
            # (mqtt.yaml) verpackt den Wert per command_template in main/config/set.

          - type: markdown
            content: "## Ventile"
            grid_options:
              columns: full
            card_mod:
              style: |
                ha-card {
                  min-width: 700px;
                }

          - type: custom:stack-in-card
            mode: horizontal
            grid_options:
              columns: full
            card_mod:
              style: |
                ha-card {
                  min-width: 700px;
                }
            cards:
              - type: entities
                title: Alias
                show_header_toggle: false
                entities:
                  - entity: text.gartenwasser_v0_alias
                    name: "V0"
                  - entity: text.gartenwasser_v1_alias
                    name: "V1"
                  - entity: text.gartenwasser_v2_alias
                    name: "V2"
                  - entity: text.gartenwasser_v3_alias
                    name: "V3"
                  - entity: text.gartenwasser_v4_alias
                    name: "V4"
                  - entity: text.gartenwasser_v5_alias
                    name: "V5"

              - type: entities
                title: Laufzeit
                show_header_toggle: false
                card_mod:
                  style:
                    .: |
                      .card-content {
                        padding-top: 64px !important;
                      }
                    hui-number-entity-row$: |
                      :host {
                        min-height: 64px !important;
                        display: flex !important;
                        align-items: center !important;
                      }
                # Platzhalter oben (64px, Hoehe einer Alias-Zeile): V0/Hauptventil hat keine
                # Laufzeit, ohne diesen Abstand stuenden V1-V5 hier eine Zeile zu weit oben
                # (auf Hoehe von V0 in der Alias-Spalte statt auf Hoehe des jeweils eigenen
                # Ventils) - siehe Log.md, Nachtrag Zeilenausrichtung.
                entities:
                  - entity: number.gartenwasser_v1_laufzeit
                    name: "V1"
                  - entity: number.gartenwasser_v2_laufzeit
                    name: "V2"
                  - entity: number.gartenwasser_v3_laufzeit
                    name: "V3"
                  - entity: number.gartenwasser_v4_laufzeit
                    name: "V4"
                  - entity: number.gartenwasser_v5_laufzeit
                    name: "V5"
                # Eigene Entities (mqtt.yaml) statt der Discovery-number-Entities - max=60
                # statt 180, siehe Kommentar dort. Dieselben Topics, daher immer synchron.
            # V0 hat keine Laufzeit (Hauptventil, siehe Topic-Baum) - Alias-Spalte hat
            # dadurch eine Zeile mehr als die Laufzeit-Spalte, wie auch im WebIF-Vorbild.

          - type: markdown
            content: >-
              {% set warn = namespace(text='') %}
              {% for n in range(1, 6) %}
                {% set laufzeit = states('number.gartenbewasserung_ventil_' ~ n ~
              '_laufzeit') | float(0) %}
                {% set maxt = states('number.gartenwasser_max_time') | float(9999) %}
                {% if laufzeit > maxt %}
                  {% set warn.text = warn.text ~ '⚠️ V' ~ n ~ ' (' ~ laufzeit | int ~
              ' min) überschreitet die Maximale Laufzeit (' ~ maxt | int ~ ' min) -
              effektive Laufzeit wird begrenzt.\n' %}
                {% endif %}
              {% endfor %}
              {{ warn.text }}
            grid_options:
              columns: full
            card_mod:
              style: |
                ha-card {
                  min-width: 700px;
                }
            # Ersatz fuer die im WebIF vorhandene Gelb-Markierung ueberschrittener
            # Laufzeiten - ein per-Zeile gefaerbter Hintergrund liess sich mit den
            # verfuegbaren Bordmitteln nicht zuverlaessig umsetzen (siehe Log.md), diese
            # Text-Warnzeile erreicht denselben Zweck zuverlaessig. Zeigt nichts an
            # (leere/kollabierte Karte), wenn keine Laufzeit die Grenze ueberschreitet.

          - type: markdown
            content: >-
              Gartenbewässerung&nbsp;&nbsp;&nbsp;|&nbsp;&nbsp;&nbsp;{{
              states('sensor.gartenwasser_firmware') }}&nbsp;&nbsp;&nbsp;|&nbsp;&nbsp;&nbsp;©
              by Pfanne/26
            grid_options:
              columns: full
            card_mod:
              style: |
                ha-card {
                  text-align: center;
                  min-width: 700px;
                }

  - title: Programme
    path: gartenwasser-programme
    icon: mdi:playlist-check
    show_icon_and_title: true
    type: sections
    sections:
      - type: grid
        cards:
          - type: custom:stack-in-card
            mode: horizontal
            grid_options:
              columns: full
            card_mod:
              style: |
                ha-card {
                  min-width: 700px;
                }
            cards:
              - type: markdown
                content: "## Programme"
                card_mod:
                  style: |
                    :host {
                      flex: 1 !important;
                    }
              - type: custom:mushroom-template-card
                primary: ""
                icon: mdi:plus
                icon_color: green
                layout: vertical
                tap_action:
                  action: perform-action
                  perform_action: script.gartenwasser_programm_neu_starten
                card_mod:
                  style: |
                    :host {
                      flex: 0 0 90px !important;
                    }
                # Ausgeblendet, wenn alle 8 Slots belegt sind (docs/requirements.md-
                # Obergrenze) oder waehrend gerade ein Programm bearbeitet wird.
                visibility:
                  - condition: numeric_state
                    entity: sensor.gartenwasser_programme
                    below: 8
                  - condition: numeric_state
                    entity: input_number.gartenwasser_editier_index
                    below: 0

          # Programm-Auswahl (welches Programm die Automatik faehrt) passiert weiterhin
          # inline auf der Status-Seite (mushroom-select-card, Dropdown ohne eigenes
          # Fenster). Hier: die vollstaendige Programmliste mit Aktivieren/Bearbeiten/
          # Loeschen je Zeile, nach WebIF-Vorbild. main/programs/set ersetzt immer das
          # komplette Array (kein Einzel-Command-Topic pro Programm/Aenderung) - deshalb
          # laufen Bearbeiten/Loeschen ueber Skripte (configurations/script.yaml), die das
          # Array lesen, veraendern und komplett neu publizieren. Acht feste "Slots"
          # (Obergrenze laut docs/requirements.md), je per visibility ein-/ausgeblendet -
          # dasselbe Muster wie die 5 Ventil-Zeilen auf der Status-Seite.
          #
          # Bearbeiten oeffnet ein EINZIGES gemeinsames Formular weiter unten (nicht 8x
          # dupliziert) - die Liste blendet sich dabei komplett aus, das Formular ein
          # (beides an input_number.gartenwasser_editier_index gekoppelt). Erfuellt densel-
          # ben Effekt wie ein Inline-Formular je Zeile, ist aber wartbar.


            button_type: name
            icon: mdi:sprinkler-variant
            name: "V5"
            show_name: false
            show_state: false
            card_mod:
              style: |
                ha-card {
                  min-width: 500px;
                }
            styles: |
              .bubble-wrapper {
                box-sizing: border-box !important;
                padding: 0 8px !important;
                gap: 12px !important;
              }
              .bubble-buttons-container {
                display: none !important;
              }
              .bubble-main-icon-container {
                width: 36px !important;
                height: 36px !important;
                min-width: 36px !important;
                min-height: 36px !important;
                margin: 0 !important;
              }
              .bubble-main-icon-container ha-icon {
                color: black !important;
                --mdc-icon-size: 20px !important;
              }
              ha-card {
                --row-height: 72px !important;
                --bubble-button-icon-background-color: #43a047 !important;
              }
              ${(() => {
                const nc = card.querySelector('.bubble-name-container');
                const cc = nc.parentElement;
                const icon = card.querySelector('.bubble-main-icon-container');

                if (!cc.querySelector('.valve-index')) {
                  const idx = document.createElement('div');
                  idx.className = 'valve-index';
                  idx.textContent = 'V5';
                  idx.style.cssText = 'font-size:0.9rem;font-weight:700;color:#eceef2;flex-shrink:0;';
                  cc.insertBefore(idx, icon);
                }

                let aliasInput = nc.querySelector('input.alias-input');
                if (!aliasInput) {
                  nc.style.cssText = 'flex:1 1 230px; min-width:0; margin:0; pointer-events:auto; display:flex; flex-direction:column; gap:5px;';
                  nc.innerHTML = '<div style="font-size:0.68rem;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;color:#9aa1ad;">Alias</div>';
                  aliasInput = document.createElement('input');
                  aliasInput.type = 'text';
                  aliasInput.className = 'alias-input';
                  aliasInput.style.cssText = 'width:100%;background:transparent;border:none;border-bottom:1px solid rgba(255,255,255,0.18);color:#eceef2;font-family:inherit;font-size:0.86rem;font-weight:600;padding:4px 2px;outline:none;';
                  aliasInput.addEventListener('change', () => {
                    hass.callService('text', 'set_value', { entity_id: 'text.gartenwasser_v5_alias', value: aliasInput.value });
                  });
                  nc.appendChild(aliasInput);
                }
                // Wert nur aktualisieren, wenn das Feld gerade NICHT fokussiert ist - sonst
                // wuerde ein Re-Render waehrend des Tippens den eingegebenen Text ueberschreiben.
                if (document.activeElement !== aliasInput) {
                  aliasInput.value = hass.states['text.gartenwasser_v5_alias'].state;
                }

                let sliderCol = cc.querySelector('.slider-col');
                let rangeInput;
                if (!sliderCol) {
                  sliderCol = document.createElement('div');
                  sliderCol.className = 'slider-col';
                  sliderCol.style.cssText = 'flex:0 0 210px; pointer-events:auto; display:flex; flex-direction:column; gap:5px;';
                  sliderCol.innerHTML = `
                    <style>.v5-slider-range::-webkit-slider-thumb{-webkit-appearance:none;width:0;height:36px;}
                    .v5-slider-range::-moz-range-thumb{width:0;height:36px;border:none;background:transparent;}</style>
                    <div style="font-size:0.68rem;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;color:#9aa1ad;">Laufzeit</div>
                    <div style="display:flex;align-items:center;gap:8px;width:100%;">
                      <div style="width:28px;height:28px;border-radius:50%;background:#607d8b;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                        <ha-icon icon="mdi:clock-outline" style="color:black;--mdc-icon-size:16px;"></ha-icon>
                      </div>
                      <div class="slider-field" style="position:relative;height:36px;border-radius:18px;background:#282828;display:flex;align-items:center;overflow:hidden;flex:1 1 auto;">
                        <div class="slider-fill" style="position:absolute;left:0;top:0;bottom:0;background:#607d8b;border-radius:18px 0 0 18px;pointer-events:none;"></div>
                        <div class="slider-label" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:0.82rem;font-weight:600;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,0.5);pointer-events:none;z-index:1;font-variant-numeric:tabular-nums;"></div>
                        <input type="range" class="v5-slider-range" min="0" max="60" step="1" style="position:relative;z-index:2;-webkit-appearance:none;appearance:none;width:100%;height:100%;margin:0;background:transparent;cursor:pointer;">
                      </div>
                    </div>`;
                  cc.appendChild(sliderCol);
                  rangeInput = sliderCol.querySelector('input.v5-slider-range');
                  const fill = sliderCol.querySelector('.slider-fill');
                  const label = sliderCol.querySelector('.slider-label');
                  const sync = () => {
                    const pct = (rangeInput.value / rangeInput.max) * 100;
                    fill.style.width = pct + '%';
                    label.textContent = Math.round(rangeInput.value) + ' min';
                  };
                  rangeInput.addEventListener('input', sync);
                  rangeInput.addEventListener('change', () => {
                    hass.callService('number', 'set_value', { entity_id: 'number.gartenwasser_v5_laufzeit', value: rangeInput.value });
                  });
                  rangeInput._sync = sync;
                } else {
                  rangeInput = sliderCol.querySelector('input.v5-slider-range');
                }
                if (document.activeElement !== rangeInput) {
                  rangeInput.value = hass.states['number.gartenwasser_v5_laufzeit'].state;
                }
                rangeInput._sync();
              })()}

          - type: markdown
            content: >-
              {% set warn = namespace(text='') %}
              {% for n in range(1, 6) %}
                {% set laufzeit = states('number.gartenbewasserung_ventil_' ~ n ~
              '_laufzeit') | float(0) %}
                {% set maxt = states('number.gartenwasser_max_time') | float(9999) %}
                {% if laufzeit > maxt %}
                  {% set warn.text = warn.text ~ '⚠️ V' ~ n ~ ' (' ~ laufzeit | int ~
              ' min) überschreitet die Maximale Laufzeit (' ~ maxt | int ~ ' min) -
              effektive Laufzeit wird begrenzt.\n' %}
                {% endif %}
              {% endfor %}
              {{ warn.text }}
            grid_options:
              columns: full
            card_mod:
              style: |
                ha-card {
                  min-width: 500px;
                }
            # Ersatz fuer die im WebIF vorhandene Gelb-Markierung ueberschrittener
            # Laufzeiten - ein per-Zeile gefaerbter Hintergrund liess sich mit den
            # verfuegbaren Bordmitteln nicht zuverlaessig umsetzen (siehe Log.md), diese
            # Text-Warnzeile erreicht denselben Zweck zuverlaessig. Zeigt nichts an
            # (leere/kollabierte Karte), wenn keine Laufzeit die Grenze ueberschreitet.

          - type: markdown
            content: >-
              Gartenbewässerung&nbsp;&nbsp;&nbsp;|&nbsp;&nbsp;&nbsp;{{
              states('sensor.gartenwasser_firmware') }}&nbsp;&nbsp;&nbsp;|&nbsp;&nbsp;&nbsp;©
              by Pfanne/26
            grid_options:
              columns: full
            card_mod:
              style: |
                ha-card {
                  text-align: center;
                  min-width: 500px;
                }

  - title: Programme
    path: gartenwasser-programme
    icon: mdi:playlist-check
    show_icon_and_title: true
    type: sections
    sections:
      - type: grid
        cards:
          - type: custom:stack-in-card
            mode: horizontal
            grid_options:
              columns: full
            card_mod:
              style: |
                ha-card {
                  min-width: 700px;
                }
            cards:
              - type: markdown
                content: "## Programme"
                card_mod:
                  style: |
                    :host {
                      flex: 1 !important;
                    }
              - type: custom:mushroom-template-card
                primary: ""
                icon: mdi:plus
                icon_color: green
                layout: vertical
                tap_action:
                  action: perform-action
                  perform_action: script.gartenwasser_programm_neu_starten
                card_mod:
                  style: |
                    :host {
                      flex: 0 0 90px !important;
                    }
                # Ausgeblendet, wenn alle 8 Slots belegt sind (docs/requirements.md-
                # Obergrenze) oder waehrend gerade ein Programm bearbeitet wird.
                visibility:
                  - condition: numeric_state
                    entity: sensor.gartenwasser_programme
                    below: 8
                  - condition: numeric_state
                    entity: input_number.gartenwasser_editier_index
                    below: 0

          # Programm-Auswahl (welches Programm die Automatik faehrt) passiert weiterhin
          # inline auf der Status-Seite (mushroom-select-card, Dropdown ohne eigenes
          # Fenster). Hier: die vollstaendige Programmliste mit Aktivieren/Bearbeiten/
          # Loeschen je Zeile, nach WebIF-Vorbild. main/programs/set ersetzt immer das
          # komplette Array (kein Einzel-Command-Topic pro Programm/Aenderung) - deshalb
          # laufen Bearbeiten/Loeschen ueber Skripte (configurations/script.yaml), die das
          # Array lesen, veraendern und komplett neu publizieren. Acht feste "Slots"
          # (Obergrenze laut docs/requirements.md), je per visibility ein-/ausgeblendet -
          # dasselbe Muster wie die 5 Ventil-Zeilen auf der Status-Seite.
          #
          # Bearbeiten oeffnet ein EINZIGES gemeinsames Formular weiter unten (nicht 8x
          # dupliziert) - die Liste blendet sich dabei komplett aus, das Formular ein
          # (beides an input_number.gartenwasser_editier_index gekoppelt). Erfuellt densel-
          # ben Effekt wie ein Inline-Formular je Zeile, ist aber wartbar.

          - type: custom:stack-in-card
            mode: horizontal
            grid_options:
              columns: full
            card_mod:
              style: |
                ha-card {
                  min-width: 700px;
                }
            visibility:
              - condition: numeric_state
                entity: sensor.gartenwasser_programme
                above: 0
              - condition: numeric_state
                entity: input_number.gartenwasser_editier_index
                below: 0
            cards:
              - type: custom:mushroom-template-card
                primary: "{{ state_attr('sensor.gartenwasser_programme', 'programs')[0].name }}"
                secondary: >-
                  {% set prog = state_attr('sensor.gartenwasser_programme', 'programs')[0] %}
                  {% set vns = namespace(parts=[]) %}
                  {% for n in range(1, 6) %}
                    {% if prog.auto.get('V' ~ n, false) %}
                      {% set vns.parts = vns.parts + ['V' ~ n ~ ' ' ~ prog.time.get('V' ~ n, 0) ~ 'min'] %}
                    {% endif %}
                  {% endfor %}
                  {{ vns.parts | join(', ') if vns.parts else 'keine Ventile' }}
                icon: mdi:playlist-play
                layout: vertical
                card_mod:
                  style: |
                    :host {
                      flex: 3 !important;
                    }
              - type: custom:mushroom-template-card
                primary: Aktivieren
                icon: mdi:play
                layout: vertical
                icon_color: >-
                  {{ 'grey' if state_attr('sensor.gartenwasser_programme', 'activeProgram') | int == 1 else 'green' }}
                tap_action:
                  action: perform-action
                  perform_action: mqtt.publish
                  data:
                    topic: "gartenwasser/main/program/cmd"
                    payload: "1"
              - type: custom:mushroom-template-card
                primary: Bearbeiten
                icon: mdi:pencil
                layout: vertical

                card.querySelector('.bubble-sub-button-3').style.background = gradFill(flashPct);
                // Kombinierter Name+Zustand-Text ("RAM · 74% (184/247 KB)") ist auf schmalen
                // Bildschirmen zu lang (Flash-Button wurde abgeschnitten) - auf Kurzform kuerzen.
                card.querySelector('.bubble-sub-button-2 .bubble-sub-button-name-container').textContent = 'RAM ' + ramPct + '%';
                card.querySelector('.bubble-sub-button-3 .bubble-sub-button-name-container').textContent = 'Flash ' + flashPct + '%';

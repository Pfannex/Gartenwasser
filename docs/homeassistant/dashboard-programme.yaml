  - title: Zeitplan
    path: gartenwasser-zeitplan
    icon: mdi:calendar-clock
    show_icon_and_title: true
    type: sections
    sections:
      - type: grid
        cards:
          - type: markdown
            content: "## Zeitplan"
            grid_options:
              columns: full
            card_mod:
              style: |
                ha-card {
                  min-width: 700px;
                }

          - type: entities
            show_header_toggle: false
            grid_options:
              columns: full
            card_mod:
              style: |
                ha-card {
                  min-width: 700px;
                }
            entities:
              - entity: switch.gartenwasser_zeitplan_aktiv
                name: Zeitplan aktiv

          - type: markdown
            content: |
              {% set wd_map = {'mon':'Mo','tue':'Di','wed':'Mi','thu':'Do','fri':'Fr','sat':'Sa','sun':'So'} %}
              {% set ns = namespace(lines=[]) %}
              {% for entry in state_attr('sensor.gartenwasser_zeitplan', 'schedule') or [] %}
                {% set status = '✅' if entry.enabled else '⏸️' %}
                {% if entry.type == 'daily' %}
                  {% set when = 'Täglich, ' ~ entry.time ~ ' Uhr' %}
                {% elif entry.type == 'weekly' %}
                  {% set wdns = namespace(names=[]) %}
                  {% for wd in entry.weekdays %}
                    {% set wdns.names = wdns.names + [wd_map.get(wd, wd)] %}
                  {% endfor %}
                  {% set when = (wdns.names | join(', ')) ~ ', ' ~ entry.time ~ ' Uhr' %}
                {% elif entry.type == 'once' %}
                  {% set d = entry.date.split('-') %}
                  {% set when = 'Einmalig ' ~ d[2] ~ '.' ~ d[1] ~ '.' ~ d[0] ~ ', ' ~ entry.time ~ ' Uhr' %}
                {% else %}
                  {% set when = entry.time %}
                {% endif %}
                {% set ns.lines = ns.lines + [status ~ ' **' ~ entry.program ~ '** - ' ~ when] %}
              {% endfor %}
              {% if ns.lines %}
              {{ ns.lines | join('\n\n') }}
              {% else %}
              Keine Zeitplan-Eintraege vorhanden.
              {% endif %}
            grid_options:

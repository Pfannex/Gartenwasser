          - type: entities
            title: Diagnose
            grid_options:
              columns: 6
            show_header_toggle: false
            entities:
              - entity: sensor.gartenbewasserung_i2c_status
                name: I2C-Bus
              - entity: sensor.gartenbewasserung_letzter_fehler
                name: Letzter Fehler
              - entity: sensor.gartenwasser_firmware
                name: Firmware
              - entity: sensor.gartenwasser_ram
                name: RAM
              - entity: sensor.gartenwasser_flash
                name: Flash

          - type: markdown
            content: >-
              Gartenbewässerung | {{ states('sensor.gartenwasser_firmware') }} | © by
              Pfanne/26
            grid_options:
              columns: full
            card_mod:
              style: |
                ha-card {
                  text-align: center;
                }
            # Fusszeile nach WebIF-Vorbild (docs/manual/images) - "Gartenbewaesserung" und
            # das Copyright sind bewusst statischer Text (kein passendes MQTT-Topic dafuer),
            # nur die Firmware-Version in der Mitte ist live aus diagnostics/version.

  - title: Konfiguration
    path: gartenwasser-konfiguration
    icon: mdi:cog-outline
    show_icon_and_title: true
    cards:
      - type: markdown
        content: "## Globale Einstellungen"

      - type: entities
        show_header_toggle: false
        entities:
          - entity: number.gartenwasser_max_time
            name: Maximale Laufzeit
        # main/time/maxTime ist nicht direkt schreibbar - der zugehoerige MQTT-number
        # (mqtt.yaml) verpackt den Wert per command_template in main/config/set.

      - type: markdown
        content: >
          Harte Obergrenze pro Ventil (`min(Laufzeit, Max)`) — überschreitet eine
          konfigurierte Laufzeit diesen Wert, wird das im WebIF gelb markiert (in HA nicht
          separat abgebildet).

      - type: markdown
        content: "## Ventile"

      - type: markdown
        content: >
          Laufzeit/Alias gelten für den manuellen Betrieb (z. B. Kachel-Klick auf dem
          Dashboard) und werden beim Verlassen eines Feldes sofort übernommen. Automatik
          wird ausschließlich über Programme gesetzt — eine hier geänderte Laufzeit setzt
          das aktive Programm auf „MANUELL" zurück (siehe Hinweis dazu auf der Statusseite).

      - type: entities
        show_header_toggle: false
        entities:
          - entity: text.gartenwasser_v0_alias
            name: "V0 Alias"
          - entity: text.gartenwasser_v1_alias
            name: "V1 Alias"
          - entity: number.gartenbewasserung_ventil_1_laufzeit
            name: "V1 Laufzeit"
          - entity: text.gartenwasser_v2_alias
            name: "V2 Alias"
          - entity: number.gartenbewasserung_ventil_2_laufzeit
            name: "V2 Laufzeit"
          - entity: text.gartenwasser_v3_alias
            name: "V3 Alias"
          - entity: number.gartenbewasserung_ventil_3_laufzeit
            name: "V3 Laufzeit"
          - entity: text.gartenwasser_v4_alias
            name: "V4 Alias"
          - entity: number.gartenbewasserung_ventil_4_laufzeit
            name: "V4 Laufzeit"
          - entity: text.gartenwasser_v5_alias
            name: "V5 Alias"
          - entity: number.gartenbewasserung_ventil_5_laufzeit
            name: "V5 Laufzeit"

  - title: Programme
    path: gartenwasser-programme
    icon: mdi:playlist-check
    show_icon_and_title: true
    cards:
      # Programm-Auswahl passiert jetzt inline auf der Status-Seite (mushroom-select-card,
      # Dropdown ohne eigenes Fenster) - die fruehere "Programm waehlen"-entities-Karte hier
      # wurde entfernt, weil eine entities-Karte bei input_select IMMER den more-info-Dialog
      # (eigenes Fenster) oeffnet - genau das, was hier vermieden werden sollte.
      - type: markdown
        content: >
          **Programm-Editor noch nicht umgesetzt.** Anlegen/Bearbeiten/Loeschen von
          Programmen (Ventile + Laufzeiten je Programm) gibt es bisher nur im WebIF -
          dafuer muesste die Firmware zusaetzliche MQTT-Command-Topics anbieten. Die
          Programm-Auswahl selbst (welches Programm aktiv ist) geht bereits inline
          auf der Status-Seite.

  - title: Zeitplan
    path: gartenwasser-zeitplan
    icon: mdi:calendar-clock
    show_icon_and_title: true
    cards:
      - type: markdown
        content: >
          **Noch nicht umgesetzt.** Zeitplan-Verwaltung (Eintraege, Wochentage,
          aktiv/pausiert) hat aktuell kein MQTT-Aequivalent - nur im WebIF verfuegbar.

  - title: Log
    path: gartenwasser-log
    icon: mdi:text-box-outline
    show_icon_and_title: true
    cards:
      - type: logbook
        title: Aktivitaet
        entities:
          - switch.gartenbewasserung_automatik_sequenz
          - switch.gartenbewasserung_ventil_1
          - switch.gartenbewasserung_ventil_2
          - switch.gartenbewasserung_ventil_3
          - switch.gartenbewasserung_ventil_4
          - switch.gartenbewasserung_ventil_5
        hours_to_show: 24

  - title: Info
    path: gartenwasser-info
    icon: mdi:information-outline
    show_icon_and_title: true
    cards:
      - type: markdown
        content: >
          **Nur teilweise umgesetzt.** Partitionstabelle, Reset-Grund, RSSI, IP/Broker
          (aus `main/info/*`) sind noch nicht als Entities verfuegbar. Firmware/RAM/
          Flash aus `diagnostics/*` sind vorgesehen, aktuell aber noch nicht sauber
          eingerichtet (siehe Diagnose-Karte auf der Status-Seite).

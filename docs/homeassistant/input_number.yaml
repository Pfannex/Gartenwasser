# Ergaenzung zu configurations/input_number.yaml (Home Assistant) - unter bestehende
# Eintraege anhaengen, NICHT ersetzen. `input_number:` ist bei dir bereits eingebunden.
#
# Editier-Zustand + Entwurfswerte fuer den Programm-Editor auf der Programme-Seite
# (dashboard-programme.yaml) - siehe auch input_boolean.yaml/input_text.yaml/script.yaml
# in diesem Ordner.

gartenwasser_editier_index:
  name: "Gartenwasser Editier-Index"
  icon: mdi:pencil
  min: -1
  max: 7
  step: 1
  mode: box
  # -1 = kein Programm wird gerade bearbeitet (Liste sichtbar), 0-7 = Index des Programms
  # im "programs"-Array, das gerade im Formular bearbeitet wird (Liste ausgeblendet,
  # Formular sichtbar) - siehe visibility-Bedingungen im Dashboard.

gartenwasser_zeitplan_editier_index:
  name: "Gartenwasser Zeitplan Editier-Index"
  icon: mdi:pencil
  min: -1
  max: 15
  step: 1
  mode: box
  # Gleiches Muster wie gartenwasser_editier_index, nur fuer den Zeitplan-Editor
  # (dashboard-programme.yaml, Zeitplan-Seite) - -1 = Liste sichtbar, 0-15 = Index des
  # Eintrags im "schedule"-Array (kMaxScheduleEntries = 16 in der Firmware, siehe
  # docs/spec/15-wochenplan.md).

gartenwasser_entwurf_v1_zeit:
  name: "Gartenwasser Entwurf V1 Zeit"
  min: 0
  max: 60
  step: 1
  mode: box
  unit_of_measurement: "min"

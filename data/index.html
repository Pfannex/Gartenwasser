<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gartenwasser</title>
  <link rel="stylesheet" href="style.css" />
  <script src="mqtt.min.js"></script>
  <script src="app.js"></script>
  <script defer src="alpine.min.js"></script>
</head>
<body x-data="dashboard()">
  <div class="page">
    <div class="topbar">
      <div class="brand">
        <div class="brand-mark">GW</div>
        <h1>Gartenwasser</h1>
      </div>
      <nav class="tabs">
        <a class="active" href="#">Status</a>
        <a href="konfiguration.html">Konfiguration</a>
        <a class="soon" href="#">Programme</a>
        <a class="soon" href="#">Zeitplan</a>
      </nav>
      <div class="status-chips">
        <span class="chip" :data-state="connected ? 'auto' : 'running'"><span class="dot"></span><span x-text="connected ? 'Verbunden' : 'Getrennt'"></span></span>
        <span class="chip" :data-state="deviceOnline ? 'auto' : 'idle'"><span class="dot"></span><span x-text="deviceOnline ? 'Gerät online' : 'Gerät offline'"></span></span>
      </div>
    </div>

    <div class="card hero">
      <button class="hero-btn" :data-running="sequenceRunning" @click="toggleSequence()">
        <span class="icon" x-text="sequenceRunning ? '■' : '▶'"></span>
        <span class="label" x-text="sequenceRunning ? 'STOP' : 'START'"></span>
      </button>
      <div class="hero-info">
        <template x-if="activeProgramName">
          <div class="program-tag">Programm: <span x-text="activeProgramName"></span></div>
        </template>
        <div class="headline" x-text="heroHeadline()"></div>
        <template x-if="sequenceRunning">
          <div>
            <div class="meta-row">
              <span>Restlaufzeit <span x-text="activeValveLabel()"></span> - <b x-text="activeValveRemaining()"></b></span>
              <div class="progress-track"><div class="progress-fill" :style="`width: ${valveProgressPercent()}%`"></div></div>
            </div>
            <div class="meta-row">
              <span>Restlaufzeit Programm <span x-text="activeProgramName"></span> - <b x-text="remainingTotal"></b></span>
              <div class="progress-track"><div class="progress-fill total" :style="`width: ${sequenceProgressPercent()}%`"></div></div>
            </div>
          </div>
        </template>
      </div>
    </div>

    <h2>Ventile</h2>
    <div class="valve-grid">
      <template x-for="v in valves" :key="v.index">
        <div class="card valve-card" :class="v.index > 0 ? 'clickable' : ''" @click="toggleValve(v)">
          <div class="valve-dot" :data-state="valveState(v)" x-text="'V' + v.index"></div>
          <div class="valve-name" x-text="v.alias || ('V' + v.index)"></div>
          <div class="valve-meta" x-text="valveMeta(v)"></div>
        </div>
      </template>
      <div class="card valve-card reserved">
        <div class="valve-dot" data-state="idle">V6</div>
        <div class="valve-name">—</div>
        <div class="valve-meta">reserviert</div>
      </div>
      <div class="card valve-card reserved">
        <div class="valve-dot" data-state="idle">V7</div>
        <div class="valve-name">—</div>
        <div class="valve-meta">reserviert</div>
      </div>
    </div>

    <h2>Übersicht</h2>
    <div class="footer-grid">
      <div class="card footer-card">
        <div class="row-head">
          <span>Aktives Programm</span>
          <button class="ghost" title="Folgt in Phase 19">Ändern</button>
        </div>
        <div class="program-name" x-text="activeProgramName || 'Kein Programm gewählt'"></div>
        <div class="program-detail" x-text="programDetail()"></div>
      </div>
      <div class="card footer-card">
        <div class="row-head"><span>Diagnostics</span></div>
        <div class="diag-row">
          <span class="diag-dot" :class="i2cStatus === 'ok' ? 'ok' : 'error'"></span>
          <span class="label">I2C-Bus</span>&nbsp;<b x-text="i2cStatus"></b>
        </div>
        <div class="diag-row">
          <span class="label">Letzter Fehler</span>&nbsp;<span x-text="lastError || 'keiner'"></span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>

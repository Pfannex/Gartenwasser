<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gartenwasser</title>
  <link rel="stylesheet" href="style.css" />
  <script src="mqtt.min.js"></script>
  <script defer src="status.bundle.js"></script>
</head>
<body x-data="dashboard()">
  <div class="page">
    <div class="topbar">
      <div class="brand">
        <div class="brand-mark">GW</div>
        <h1>Gartenwasser</h1>
      </div>
      <nav class="tabs">
        <a class="active" href="#">Status</a>
        <a href="konfiguration.html">Konfiguration</a>
        <a href="programme.html">Programme</a>
        <a href="zeitplan.html">Zeitplan</a>
        <a href="log.html">Log</a>
        <a href="ota.html">Update</a>
        <a href="info.html">Info</a>
      </nav>
      <div class="status-chips">
        <span class="chip" :data-state="connected ? 'auto' : 'running'"><span class="dot"></span><span x-text="connected ? 'Verbunden' : 'Getrennt'"></span></span>
        <span class="chip" :data-state="deviceOnline ? 'auto' : 'idle'"><span class="dot"></span><span x-text="deviceOnline ? 'Gerät online' : 'Gerät offline'"></span></span>
      </div>
    </div>

    <div class="card hero">
      <button class="hero-btn" :data-running="sequenceRunning" :disabled="!sequenceRunning && !activeProgramName" @click="toggleSequence()">
        <span class="icon" x-text="sequenceRunning ? '■' : '▶'"></span>
        <span class="label" x-text="sequenceRunning ? 'STOP' : 'START'"></span>
      </button>
      <div class="hero-info">
        <div class="program-picker" :class="sequenceRunning ? 'disabled' : ''" @click="togglePicker()">
          <span class="program-tag" x-text="activeProgramName || 'Programm wählen'"></span>
          <span class="caret">▾</span>
          <div class="program-picker-menu" x-show="pickerOpen" @click.outside="pickerOpen = false" @click.stop>
            <button type="button" :class="activeProgramIndex === 0 ? 'active' : ''" @click="selectProgram(0)">Kein Programm</button>
            <template x-for="(p, i) in programs" :key="i">
              <button type="button" :class="activeProgramIndex === i + 1 ? 'active' : ''" @click="selectProgram(i + 1)" x-text="p.name"></button>
            </template>
          </div>
        </div>

        <template x-if="sequenceRunning">
          <div class="headline" x-text="heroHeadline()"></div>
        </template>
        <template x-if="sequenceRunning">
          <div>
            <div class="meta-row">
              <span>Restlaufzeit <span x-text="activeValveLabel()"></span> - <b x-text="activeValveRemaining()"></b></span>
              <div class="progress-track"><div class="progress-fill" :style="`width: ${valveProgressPercent()}%`"></div></div>
            </div>
            <div class="meta-row">
              <span>Restlaufzeit Programm <span x-text="activeProgramName"></span> - <b x-text="remainingTotal"></b></span>
              <div class="progress-track"><div class="progress-fill total" :style="`width: ${sequenceProgressPercent()}%`"></div></div>
            </div>
          </div>
        </template>
        <template x-if="!sequenceRunning && nextSchedule()">
          <div class="meta-row">Nächster Termin <b x-text="nextSchedule().program"></b> - <span x-text="nextSchedule().when"></span></div>
        </template>
      </div>
    </div>

    <h2>Ventile</h2>
    <div class="valve-grid">
      <template x-for="v in valves" :key="v.index">
        <div class="card valve-card" :class="v.index > 0 ? 'clickable' : ''" @click="toggleValve(v)">
          <div class="valve-dot" :data-state="valveState(v)" x-text="'V' + v.index"></div>
          <div class="valve-name" x-text="v.alias || ('V' + v.index)"></div>
          <div class="valve-meta" x-text="valveMeta(v)"></div>
        </div>
      </template>
      <div class="card valve-card reserved">
        <div class="valve-dot" data-state="idle">V6</div>
        <div class="valve-name">—</div>
        <div class="valve-meta">reserviert</div>
      </div>
      <div class="card valve-card reserved">
        <div class="valve-dot" data-state="idle">V7</div>
        <div class="valve-name">—</div>
        <div class="valve-meta">reserviert</div>
      </div>
    </div>

    <h2>Diagnostics</h2>
    <div class="card footer-card">
      <div class="diag-row">
        <span class="label"><span class="diag-dot" :class="i2cStatus === 'ok' ? 'ok' : 'error'"></span>I2C-Bus</span><b x-text="i2cStatus"></b>
      </div>
      <div class="diag-row">
        <span class="label">Letzter Fehler</span><span x-text="lastError || 'keiner'"></span>
      </div>
      <div class="diag-row">
        <span class="label">Firmware</span><span x-text="version || '…'"></span>
      </div>
      <div class="diag-row">
        <span class="label">RAM</span><span x-text="ram || '…'"></span>
      </div>
      <div class="diag-row">
        <span class="label">Flash</span><span x-text="flash || '…'"></span>
      </div>
    </div>

    <footer class="site-footer">Gartenbewässerung<span class="sep">|</span><span x-text="version || '…'"></span><span class="sep">|</span>© by Pfanne/26</footer>
  </div>
</body>
</html>

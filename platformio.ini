; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c6-devkitc-1]
platform = espressif32
board = esp32-c6-devkitc-1
framework = arduino

; --- Flash / Partitions -----------------------------------------------------
board_upload.flash_size = 8MB
board_build.partitions = partitions.csv
board_build.filesystem = spiffs

; --- Serial ------------------------------------------------------------------
monitor_speed = 115200
upload_speed = 921600
upload_port = COM8
monitor_port = COM8

; --- Libraries -----------------------------------------------------------
; esp_lcd_touch_axs5106l liegt lokal in lib/ (keine Registry-Version verfügbar)
lib_deps =
    moononournation/GFX Library for Arduino @ 1.6.5
    lvgl/lvgl @ 8.3.11
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^6.21

; lv_conf.h liegt in include/ und wird per LV_CONF_INCLUDE_SIMPLE gefunden.
; -I include wird explizit gesetzt, da beim ESP32-C6 (Arduino-as-ESP-IDF-component)
; die automatische globale Include-Suche der Libraries den Projekt-include-Ordner
; sonst nicht immer sieht.
; ARDUINO_USB_MODE/CDC_ON_BOOT: ESP32-C6 hat keinen separaten USB-UART-Chip,
; sondern nutzt den internen USB-Serial/JTAG-Controller. Ohne diese Flags
; bleibt Serial eine (nicht angeschlossene) HardwareSerial-Instanz und
; Serial-Ausgaben landen nie auf dem Monitor-Port.
build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c6-devkitc-1]
platform = espressif32
board = esp32-c6-devkitc-1
framework = arduino

; --- Flash / Partitions -----------------------------------------------------
board_upload.flash_size = 8MB
board_build.partitions = partitions.csv
; LittleFS statt SPIFFS (Phase 16, Web-Interface): moderner Nachfolger, besser
; geeignet fuer mehrere benannte Dateien (index.html/style.css/app.js). Die
; "spiffs"-Partition in partitions.csv ist nur ein Label, die Groesse/Lage
; bleibt unveraendert, nur das Dateisystemformat darauf aendert sich.
board_build.filesystem = littlefs

; --- Serial ------------------------------------------------------------------
monitor_speed = 115200
upload_speed = 921600
upload_port = COM8
monitor_port = COM8

; --- Libraries -----------------------------------------------------------
; esp_lcd_touch_axs5106l liegt lokal in lib/ (keine Registry-Version verfügbar)
; ESPAsyncWebServer/AsyncTCP (Phase 16, Web-Interface): ueber den aktiv
; gepflegten ESP32Async-Fork bezogen (der urspruengliche me-no-dev-Namensraum
; ist unmaintained), De-facto-Standard fuer nicht-blockierende ESP32-Webserver.
lib_deps =
    moononournation/GFX Library for Arduino @ 1.6.5
    lvgl/lvgl @ 8.3.11
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^6.21
    https://github.com/ESP32Async/AsyncTCP.git
    https://github.com/ESP32Async/ESPAsyncWebServer.git

; lv_conf.h liegt in include/ und wird per LV_CONF_INCLUDE_SIMPLE gefunden.
; -I include wird explizit gesetzt, da beim ESP32-C6 (Arduino-as-ESP-IDF-component)
; die automatische globale Include-Suche der Libraries den Projekt-include-Ordner
; sonst nicht immer sieht.
; ARDUINO_USB_MODE/CDC_ON_BOOT: ESP32-C6 hat keinen separaten USB-UART-Chip,
; sondern nutzt den internen USB-Serial/JTAG-Controller. Ohne diese Flags
; bleibt Serial eine (nicht angeschlossene) HardwareSerial-Instanz und
; Serial-Ausgaben landen nie auf dem Monitor-Port.
build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Zaehlt build_number.txt bei jedem Build um 1 hoch und generiert daraus
; include/BuildNumber.h (kBuildNumber, 5-stellig) - siehe tools/increment_build_number.py.
; Wird von [env:esp32-c6-devkitc-1-ota] geerbt (extends unten) - ein "pio run" ohne -e
; baut beide Environments und zaehlt dadurch zweimal hoch (siehe -e-Hinweis bei den
; einzelnen pio-Aufrufen weiter unten).
extra_scripts = pre:tools/increment_build_number.py

; --- PlatformIO/VSCode-OTA (Phase 21, zweiter Teil) --------------------------
; Erbt alles vom Serial-Environment oben, ueberschreibt nur den Upload-Weg:
; "pio run -e esp32-c6-devkitc-1-ota -t upload" bzw. "-t uploadfs" flashen
; uebers WLAN (ArduinoOTA, siehe src/OTA.cpp) statt ueber COM8. Kein Monitor
; moeglich (kein USB-Zugriff dabei) - monitor_port/-speed bleiben ungenutzt.
; upload_port ist die aktuelle Geraete-IP, alternativ "gartenwasser.local"
; (mDNS-Hostname, siehe OTA::begin()), falls sich die IP mal aendert.
[env:esp32-c6-devkitc-1-ota]
extends = env:esp32-c6-devkitc-1
upload_protocol = espota
upload_port = 192.168.10.33

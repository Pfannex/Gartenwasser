homeassistant:
  customize: !include customize.yaml
  packages: !include_dir_named configurations/packages

# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

scene: !include scenes.yaml

openhasp: !include configurations/plates/openhasp.yaml

# Das Gartenwasser-Dashboard ist seit 2026-10-02 Teil des Handy-Dashboards im Repo
# https://github.com/Pfannex/HomeAssistant (dashboards/handy/gartenwasser/) - dort auch die
# aktuelle configuration.yaml der Hauptinstanz.
lovelace:
  mode: storage

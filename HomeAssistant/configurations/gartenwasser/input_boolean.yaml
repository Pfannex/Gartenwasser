# Neue Datei fuer Home Assistant - noch NICHT in configuration.yaml eingebunden.
# Erfordert einen NEUEN Include in der Haupt-configuration.yaml (input_boolean gibt es
# dort aktuell noch nicht):
#
#   input_boolean: !include configurations/input_boolean.yaml
#
# Diese Datei dann als configurations/input_boolean.yaml ablegen.
#
# Entwurfs-Auto-Flags fuer den Programm-Editor auf der Programme-Seite
# (dashboard-programme.yaml) - je Ventil, gefuellt von
# script.gartenwasser_programm_bearbeiten_starten, ausgelesen von
# script.gartenwasser_programm_speichern.

gartenwasser_entwurf_v1_auto:
  name: "Gartenwasser Entwurf V1 Auto"
gartenwasser_entwurf_v2_auto:
  name: "Gartenwasser Entwurf V2 Auto"
gartenwasser_entwurf_v3_auto:
  name: "Gartenwasser Entwurf V3 Auto"
gartenwasser_entwurf_v4_auto:
  name: "Gartenwasser Entwurf V4 Auto"
gartenwasser_entwurf_v5_auto:
  name: "Gartenwasser Entwurf V5 Auto"

# Entwurfs-Helper fuer den Zeitplan-Editor (dashboard-programme.yaml, Zeitplan-Seite) -
# gleiches Muster wie die Programm-Entwurfs-Helper oben. mon-sun = angehakte Wochentage
# bei type "weekly" (entry.weekdays, siehe docs/spec/15-wochenplan.md). Kein "aktiv"-Helper
# mehr - Pausieren/Aktivieren eines Eintrags (entry.enabled) laeuft ausschliesslich ueber
# den Icon-Toggle auf der Zeitplan-Hauptseite, nicht ueber das Formular.
gartenwasser_zeitplan_entwurf_mon:
  name: "Gartenwasser Zeitplan Entwurf Montag"
gartenwasser_zeitplan_entwurf_tue:
  name: "Gartenwasser Zeitplan Entwurf Dienstag"
gartenwasser_zeitplan_entwurf_wed:
  name: "Gartenwasser Zeitplan Entwurf Mittwoch"
gartenwasser_zeitplan_entwurf_thu:
  name: "Gartenwasser Zeitplan Entwurf Donnerstag"
gartenwasser_zeitplan_entwurf_fri:
  name: "Gartenwasser Zeitplan Entwurf Freitag"
gartenwasser_zeitplan_entwurf_sat:
  name: "Gartenwasser Zeitplan Entwurf Samstag"
gartenwasser_zeitplan_entwurf_sun:
  name: "Gartenwasser Zeitplan Entwurf Sonntag"

# Auswahl-Modus fuer den Zeit-Stepper auf der Plate-Settings-Seite (Zeitplan-Kategorie):
# aus = Stunde ausgewaehlt, an = Minute ausgewaehlt. Tap auf Stunde- ODER Minute-Button
# schaltet um (siehe openhasp.yaml, p4b67/p4b81) - so lassen sich grosse Zeitspruenge
# (Stunde) und Feinjustierung (Minute) getrennt vornehmen, statt in 15-Minuten-Schritten.
gartenwasser_plate_settings_zeit_minute_modus:
  name: "Gartenwasser Plate Settings Zeit Minute-Modus"

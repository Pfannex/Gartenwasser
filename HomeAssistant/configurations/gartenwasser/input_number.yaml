# Ergaenzung zu configurations/input_number.yaml (Home Assistant) - unter bestehende
# Eintraege anhaengen, NICHT ersetzen. `input_number:` ist bei dir bereits eingebunden.
#
# Editier-Zustand + Entwurfswerte fuer den Programm-Editor auf der Programme-Seite
# (dashboard-programme.yaml) - siehe auch input_boolean.yaml/input_text.yaml/script.yaml
# in diesem Ordner.

gartenwasser_editier_index:
  name: "Gartenwasser Editier-Index"
  icon: mdi:pencil
  min: -1
  max: 7
  step: 1
  mode: box
  # -1 = kein Programm wird gerade bearbeitet (Liste sichtbar), 0-7 = Index des Programms
  # im "programs"-Array, das gerade im Formular bearbeitet wird (Liste ausgeblendet,
  # Formular sichtbar) - siehe visibility-Bedingungen im Dashboard.

gartenwasser_zeitplan_editier_index:
  name: "Gartenwasser Zeitplan Editier-Index"
  icon: mdi:pencil
  min: -1
  max: 15
  step: 1
  mode: box
  # Gleiches Muster wie gartenwasser_editier_index, nur fuer den Zeitplan-Editor
  # (dashboard-programme.yaml, Zeitplan-Seite) - -1 = Liste sichtbar, 0-15 = Index des
  # Eintrags im "schedule"-Array (kMaxScheduleEntries = 16 in der Firmware, siehe
  # docs/spec/15-wochenplan.md).

gartenwasser_entwurf_v1_zeit:
  name: "Gartenwasser Entwurf V1 Zeit"
  min: 0
  max: 60
  step: 1
  mode: box
  unit_of_measurement: "min"
gartenwasser_entwurf_v2_zeit:
  name: "Gartenwasser Entwurf V2 Zeit"
  min: 0
  max: 60
  step: 1
  mode: box
  unit_of_measurement: "min"
gartenwasser_entwurf_v3_zeit:
  name: "Gartenwasser Entwurf V3 Zeit"
  min: 0
  max: 60
  step: 1
  mode: box
  unit_of_measurement: "min"
gartenwasser_entwurf_v4_zeit:
  name: "Gartenwasser Entwurf V4 Zeit"
  min: 0
  max: 60
  step: 1
  mode: box
  unit_of_measurement: "min"
gartenwasser_entwurf_v5_zeit:
  name: "Gartenwasser Entwurf V5 Zeit"
  min: 0
  max: 60
  step: 1
  mode: box
  unit_of_measurement: "min"

# Pager-Zustand fuer die Konfiguration-Kategorie auf der Plate-Settings-Seite (page 4) -
# welches Ventil (1-5) gerade im Konfiguration-Panel angezeigt/bearbeitet wird. Wird auch
# vom Programme-Panel mitbenutzt (dieselbe Ventil-Auswahl, bewusst geteilt).
gartenwasser_plate_settings_ventil:
  name: "Gartenwasser Plate Settings Ventil"
  icon: mdi:valve
  min: 1
  max: 5
  step: 1
  mode: box

# Pager-Zustand fuer die Programme-Kategorie auf der Plate-Settings-Seite (page 4) -
# 0-basierter Index in state_attr('sensor.gartenwasser_programme','programs'). Bewusst
# unabhaengig von input_number.gartenwasser_editier_index (HA-Dashboard-Formular) - die
# Plate schreibt direkt (kein Entwurf/Speichern-Schritt, siehe scripts.yaml
# gartenwasser_plate_programm_*), ein gemeinsamer Index wuerde beide Editier-Wege
# gegenseitig stoeren koennen.
gartenwasser_plate_settings_programm:
  name: "Gartenwasser Plate Settings Programm"
  icon: mdi:sprinkler-variant
  min: 0
  max: 7
  step: 1

# Pager-Zustand fuer die Zeitplan-Kategorie auf der Plate-Settings-Seite (page 4) -
# 0-basierter Index in state_attr('sensor.gartenwasser_zeitplan','schedule'). max:15
# passt zu kMaxScheduleEntries=16 in der Firmware (wie gartenwasser_zeitplan_editier_index).
gartenwasser_plate_settings_zeitplan_eintrag:
  name: "Gartenwasser Plate Settings Zeitplan Eintrag"
  icon: mdi:calendar-clock
  min: 0
  max: 15
  step: 1
  mode: box

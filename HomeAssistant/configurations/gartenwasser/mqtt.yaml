# Ergaenzung zu configurations/mqtt.yaml (Home Assistant) - unter den bestehenden
# "light:"-Block anhaengen, NICHT ersetzen. Deckt das ab, was die MQTT-Discovery (Phase 10,
# 26 automatisch erkannte Entities: Ventile, Automatik, Diagnose) bewusst nicht abdeckt -
# den Programm-Namen als lesbare Liste fuer die Dropdown-Synchronisierung, siehe
# input_select.yaml + automations.yaml in diesem Ordner.
#
# Kollisionsfrei zu den 26 Discovery-Entities: eigene unique_id, kein ueberlappendes Topic.

sensor:
  - name: "Gartenwasser Programme"
    unique_id: gartenwasser_programs_raw
    state_topic: "gartenwasser/main/programs/state"
    value_template: "{{ value_json.programs | length }}"
    unit_of_measurement: "Programme"
    json_attributes_topic: "gartenwasser/main/programs/state"
    # Attribute "programs" (Array {name,time,auto}) und "activeProgram" (Index) stehen dadurch
    # als sensor.gartenwasser_programme-Attribute zur Verfuegung - Grundlage fuer die
    # Dropdown-Synchronisierung in automations.yaml.

  # Firmware/RAM/Flash haben (wie die Programme-Liste oben) keine Discovery-Entity - die
  # 26 Discovery-Entities decken nur i2cStatus/lastError aus diagnostics/* ab. Rest sind
  # retained Plain-Text-Topics, daher ohne Template direkt uebernehmbar. Fuer das
  # Status-Dashboard (dashboard-programme.yaml), Diagnose-Karte.
  - name: "Gartenwasser Firmware"
    unique_id: gartenwasser_diag_version
    state_topic: "gartenwasser/diagnostics/version"

  - name: "Gartenwasser RAM"
    unique_id: gartenwasser_diag_ram
    state_topic: "gartenwasser/diagnostics/ram"

  - name: "Gartenwasser Flash"
    unique_id: gartenwasser_diag_flash
    state_topic: "gartenwasser/diagnostics/flash"

  # main/info/* - Hardware-/Systeminfo fuer die Info-Seite (dashboard-programme.yaml), alle
  # retained Plain-Text-Topics, keine Discovery-Entities. partitions (JSON-Array) bewusst
  # nicht als eigener Sensor angelegt - fuer die Info-Seite reicht die Anzahl, siehe
  # json_attributes.
  - name: "Gartenwasser Reset Grund"
    unique_id: gartenwasser_info_reset_reason
    state_topic: "gartenwasser/main/info/resetReason"
  - name: "Gartenwasser Uptime"
    unique_id: gartenwasser_info_uptime
    state_topic: "gartenwasser/main/info/uptime"
    unit_of_measurement: "s"
  - name: "Gartenwasser Stack Free"
    unique_id: gartenwasser_info_stack_free
    state_topic: "gartenwasser/main/info/stackFree"
    unit_of_measurement: "Byte"
  - name: "Gartenwasser RSSI"
    unique_id: gartenwasser_info_rssi
    state_topic: "gartenwasser/main/info/rssi"
    unit_of_measurement: "dBm"
  - name: "Gartenwasser IP"
    unique_id: gartenwasser_info_ip
    state_topic: "gartenwasser/main/info/ip"
  - name: "Gartenwasser Broker"
    unique_id: gartenwasser_info_broker
    state_topic: "gartenwasser/main/info/broker"
  - name: "Gartenwasser Partitionen"
    unique_id: gartenwasser_info_partitions
    state_topic: "gartenwasser/main/info/partitions"
    value_template: "{{ value_json | length }}"
    unit_of_measurement: "Partitionen"
    json_attributes_topic: "gartenwasser/main/info/partitions"
    json_attributes_template: "{{ {'partitions': value_json} | tojson }}"
    # value_json auf main/info/partitions ist direkt ein Array (kein umschliessendes
    # Objekt), json_attributes_topic erwartet aber ein Objekt - json_attributes_template
    # wrapped es in {"partitions": [...]}, damit die Liste als
    # sensor.gartenwasser_partitionen-Attribut "partitions" nutzbar ist (analog zu
    # sensor.gartenwasser_programme).

  # main/schedule/state (main/schedule/enabled ist Teil dieses JSON, kein eigenes Topic) -
  # fuer die Zeitplan-Liste auf der Zeitplan-Seite.
  - name: "Gartenwasser Zeitplan"
    unique_id: gartenwasser_schedule_raw
    state_topic: "gartenwasser/main/schedule/state"
    value_template: "{{ value_json.schedule | length }}"
    unit_of_measurement: "Eintraege"
    json_attributes_topic: "gartenwasser/main/schedule/state"

# V{n}/alias ist per V{n}/alias/set editierbar (siehe docs/requirements.md Topic-Baum) -
# als "text"-Plattform statt "sensor" (les- UND schreibbar), fuer die Konfigurationsseite
# (dashboard-programme.yaml). Ersetzt die vorherigen reinen Lese-Sensoren gleichen Namens -
# Status-Seite referenziert jetzt text.gartenwasser_v{n}_alias statt sensor.*.
text:
  - name: "Gartenwasser V0 Alias"
    unique_id: gartenwasser_v0_alias_text
    state_topic: "gartenwasser/V0/alias"
    command_topic: "gartenwasser/V0/alias/set"
  - name: "Gartenwasser V1 Alias"
    unique_id: gartenwasser_v1_alias_text
    state_topic: "gartenwasser/V1/alias"
    command_topic: "gartenwasser/V1/alias/set"
  - name: "Gartenwasser V2 Alias"
    unique_id: gartenwasser_v2_alias_text
    state_topic: "gartenwasser/V2/alias"
    command_topic: "gartenwasser/V2/alias/set"
  - name: "Gartenwasser V3 Alias"
    unique_id: gartenwasser_v3_alias_text
    state_topic: "gartenwasser/V3/alias"
    command_topic: "gartenwasser/V3/alias/set"
  - name: "Gartenwasser V4 Alias"
    unique_id: gartenwasser_v4_alias_text
    state_topic: "gartenwasser/V4/alias"
    command_topic: "gartenwasser/V4/alias/set"
  - name: "Gartenwasser V5 Alias"
    unique_id: gartenwasser_v5_alias_text
    state_topic: "gartenwasser/V5/alias"
    command_topic: "gartenwasser/V5/alias/set"

# main/time/maxTime ist ein direktes Lese-Topic, aber NICHT direkt schreibbar - Setzen laeuft
# nur ueber main/config/set (JSON, komplett oder teilweise). command_template verpackt den
# Zahlenwert deshalb in {"maxTime": <wert>}, statt die Zahl roh zu publizieren.
number:
  - name: "Gartenwasser Max Time"
    unique_id: gartenwasser_max_time
    state_topic: "gartenwasser/main/time/maxTime"
    command_topic: "gartenwasser/main/config/set"
    command_template: '{"maxTime": {{ value }}}'
    min: 0
    max: 180
    step: 1
    mode: box
    unit_of_measurement: "min"

  # V{n}/time/state|set - dieselben Topics wie die Discovery-number-Entities
  # (number.gartenbewasserung_ventil_N_laufzeit), aber mit engerem max=60 statt 180 (deren
  # Bereich kommt aus der Firmware-Discovery-Config und ist von HA aus nicht aenderbar) -
  # fuer die Laufzeit-Slider auf der Konfigurationsseite, praeziseres Ziehen im relevanten
  # Bereich. Kollisionsfrei: eigene unique_id, dieselben Topics, daher immer synchron mit
  # der Discovery-Entity (dieselbe zugrundeliegende Ventil-Laufzeit).
  - name: "Gartenwasser V1 Laufzeit"
    unique_id: gartenwasser_v1_laufzeit
    state_topic: "gartenwasser/V1/time/state"
    command_topic: "gartenwasser/V1/time/set"
    min: 0
    max: 60
    step: 1
    unit_of_measurement: "min"
  - name: "Gartenwasser V2 Laufzeit"
    unique_id: gartenwasser_v2_laufzeit
    state_topic: "gartenwasser/V2/time/state"
    command_topic: "gartenwasser/V2/time/set"
    min: 0
    max: 60
    step: 1
    unit_of_measurement: "min"
  - name: "Gartenwasser V3 Laufzeit"
    unique_id: gartenwasser_v3_laufzeit
    state_topic: "gartenwasser/V3/time/state"
    command_topic: "gartenwasser/V3/time/set"
    min: 0
    max: 60
    step: 1
    unit_of_measurement: "min"
  - name: "Gartenwasser V4 Laufzeit"
    unique_id: gartenwasser_v4_laufzeit
    state_topic: "gartenwasser/V4/time/state"
    command_topic: "gartenwasser/V4/time/set"
    min: 0
    max: 60
    step: 1
    unit_of_measurement: "min"
  - name: "Gartenwasser V5 Laufzeit"
    unique_id: gartenwasser_v5_laufzeit
    state_topic: "gartenwasser/V5/time/state"
    command_topic: "gartenwasser/V5/time/set"
    min: 0
    max: 60
    step: 1
    unit_of_measurement: "min"

# main/schedule/cmd ist ein reiner Befehls-Topic (ON|OFF), main/schedule/state enthaelt aber
# ein "enabled"-Feld als Ist-Zustand - deshalb switch (state UND command_topic getrennt) statt
# text/number wie bei Alias/MaxTime.
switch:
  - name: "Gartenwasser Zeitplan Aktiv"
    unique_id: gartenwasser_schedule_enabled
    state_topic: "gartenwasser/main/schedule/state"
    value_template: "{{ 'ON' if value_json.enabled else 'OFF' }}"
    command_topic: "gartenwasser/main/schedule/cmd"
    payload_on: "ON"
    payload_off: "OFF"


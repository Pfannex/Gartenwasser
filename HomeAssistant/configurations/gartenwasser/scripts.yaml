# Ergaenzung fuer Home Assistant - Inhalt an deine BESTEHENDE Skript-Datei anhaengen
# (bei einer frischen Instanz meist scripts.yaml im Config-Wurzelverzeichnis, worauf
# `script: !include scripts.yaml` in configuration.yaml von Haus aus zeigt - KEIN neuer
# Include noetig, anders als bei input_boolean.yaml/input_text.yaml unten). Falls du
# schon eigene Skripte hast, einfach unten anhaengen, nicht ersetzen.
#
# Drei Skripte fuer den Programm-Editor auf der Programme-Seite (dashboard-programme.yaml):
# Bearbeiten starten (Entwurfs-Helper aus dem gewaehlten Programm fuellen), Speichern
# (Entwurf zurueck ins komplette Array schreiben, main/programs/set published - das Topic
# ersetzt immer das ganze Array, siehe docs/requirements.md Topic-Baum) und Loeschen
# (Programm aus dem Array entfernen, published).
#
# Wichtig: main/programs/state liefert "time" SPARSE (nur Ventile mit auto=true haben
# einen Eintrag, siehe echte Live-Daten in docs/Log.md) - Speichern/Loeschen bauen das
# Array deshalb im selben sparsen Format neu zusammen, um die Firmware nicht mit
# unerwarteten zusaetzlichen Keys zu ueberraschen.

gartenwasser_programm_bearbeiten_starten:
  alias: "Gartenwasser: Programm-Bearbeitung starten"
  fields:
    index:
      description: "0-basierter Index des zu bearbeitenden Programms im programs-Array"
      example: 0
  sequence:
    - variables:
        prog: "{{ state_attr('sensor.gartenwasser_programme', 'programs')[index] }}"
    - action: input_text.set_value
      target:
        entity_id: input_text.gartenwasser_entwurf_name
      data:
        value: "{{ prog.name }}"
    - action: input_number.set_value
      target:
        entity_id: input_number.gartenwasser_entwurf_v1_zeit
      data:
        value: "{{ prog.time.get('V1', 5) }}"
    - action: input_number.set_value
      target:
        entity_id: input_number.gartenwasser_entwurf_v2_zeit
      data:
        value: "{{ prog.time.get('V2', 5) }}"
    - action: input_number.set_value
      target:
        entity_id: input_number.gartenwasser_entwurf_v3_zeit
      data:
        value: "{{ prog.time.get('V3', 5) }}"
    - action: input_number.set_value
      target:
        entity_id: input_number.gartenwasser_entwurf_v4_zeit
      data:
        value: "{{ prog.time.get('V4', 5) }}"
    - action: input_number.set_value
      target:
        entity_id: input_number.gartenwasser_entwurf_v5_zeit
      data:
        value: "{{ prog.time.get('V5', 5) }}"
    - if:
        - condition: template
          value_template: "{{ prog.auto.get('V1', false) }}"
      then:
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.gartenwasser_entwurf_v1_auto
      else:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.gartenwasser_entwurf_v1_auto
    - if:
        - condition: template
          value_template: "{{ prog.auto.get('V2', false) }}"
      then:
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.gartenwasser_entwurf_v2_auto
      else:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.gartenwasser_entwurf_v2_auto
    - if:
        - condition: template
          value_template: "{{ prog.auto.get('V3', false) }}"
      then:
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.gartenwasser_entwurf_v3_auto
      else:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.gartenwasser_entwurf_v3_auto
    - if:
        - condition: template
          value_template: "{{ prog.auto.get('V4', false) }}"
      then:
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.gartenwasser_entwurf_v4_auto
      else:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.gartenwasser_entwurf_v4_auto
    - if:
        - condition: template
          value_template: "{{ prog.auto.get('V5', false) }}"
      then:
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.gartenwasser_entwurf_v5_auto
      else:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.gartenwasser_entwurf_v5_auto
    # Editier-Index zuletzt setzen - erst wenn alle Entwurfs-Helper befuellt sind, damit
    # das Formular (das per visibility an editier_index haengt) nie mit alten/leeren
    # Werten kurz aufblitzt.
    - action: input_number.set_value
      target:
        entity_id: input_number.gartenwasser_editier_index
      data:
        value: "{{ index }}"

gartenwasser_programm_abbrechen:
  alias: "Gartenwasser: Programm-Bearbeitung abbrechen"
  sequence:
    - action: input_number.set_value
      target:
        entity_id: input_number.gartenwasser_editier_index
      data:
        value: -1

gartenwasser_programm_speichern:
  alias: "Gartenwasser: Programm speichern"
  sequence:
    - variables:
        idx: "{{ states('input_number.gartenwasser_editier_index') | int }}"
        programs: "{{ state_attr('sensor.gartenwasser_programme', 'programs') }}"
        active: "{{ state_attr('sensor.gartenwasser_programme', 'activeProgram') }}"
    - variables:
        new_time: >-
          {% set ns = namespace(d={}) %}
          {% for n in range(1, 6) %}
            {% if is_state('input_boolean.gartenwasser_entwurf_v' ~ n ~ '_auto', 'on') %}
              {% set ns.d = dict(ns.d, **{'V' ~ n: states('input_number.gartenwasser_entwurf_v' ~ n ~ '_zeit') | int}) %}
            {% endif %}
          {% endfor %}
          {{ ns.d }}
        new_auto: >-
          {% set ns = namespace(d={}) %}
          {% for n in range(1, 6) %}
            {% set ns.d = dict(ns.d, **{'V' ~ n: is_state('input_boolean.gartenwasser_entwurf_v' ~ n ~ '_auto', 'on')}) %}
          {% endfor %}
          {{ ns.d }}
    - variables:
        new_prog:
          name: "{{ states('input_text.gartenwasser_entwurf_name') }}"
          time: "{{ new_time }}"
          auto: "{{ new_auto }}"
        new_programs: "{{ programs[:idx] + [new_prog] + programs[idx + 1:] }}"
    - action: mqtt.publish
      data:
        topic: "gartenwasser/main/programs/set"
        payload: "{{ {'programs': new_programs, 'activeProgram': active} | tojson }}"
    - action: input_number.set_value
      target:
        entity_id: input_number.gartenwasser_editier_index
      data:
        value: -1

gartenwasser_programm_loeschen:
  alias: "Gartenwasser: Programm loeschen"
  fields:
    index:
      description: "0-basierter Index des zu loeschenden Programms im programs-Array"
      example: 0
  sequence:
    - variables:
        programs: "{{ state_attr('sensor.gartenwasser_programme', 'programs') }}"
        active: "{{ state_attr('sensor.gartenwasser_programme', 'activeProgram') }}"
        new_programs: "{{ programs[:index] + programs[index + 1:] }}"
        # activeProgram ist 1-basiert (main/program/cmd-Konvention, 0 = keins) - beim
        # Loeschen verschieben sich alle Indizes NACH dem geloeschten Programm um 1 nach
        # unten, das aktive Programm muss deshalb mitwandern (oder auf 0/keins gesetzt
        # werden, falls genau das geloeschte Programm aktiv war).
        new_active: >-
          {% if active == (index + 1) %}
            0
          {% elif active > (index + 1) %}
            {{ active - 1 }}
          {% else %}
            {{ active }}
          {% endif %}
    - action: mqtt.publish
      data:
        topic: "gartenwasser/main/programs/set"
        payload: "{{ {'programs': new_programs, 'activeProgram': new_active | int} | tojson }}"

gartenwasser_programm_neu_starten:
  alias: "Gartenwasser: Neues Programm anlegen"
  sequence:
    # Neuer Index = aktuelle Anzahl (naechster freier Slot, 0-basiert) - dasselbe
    # gemeinsame Formular wie beim Bearbeiten, nur mit leeren/neutralen Startwerten
    # statt eines bestehenden Programms. gartenwasser_programm_speichern braucht dafuer
    # keine Aenderung: programs[:idx] + [new_prog] + programs[idx+1:] haengt bei
    # idx == programs|count einfach an (programs[idx+1:] ist dann leer).
    - variables:
        idx: "{{ state_attr('sensor.gartenwasser_programme', 'programs') | count }}"
    - action: input_text.set_value
      target:
        entity_id: input_text.gartenwasser_entwurf_name
      data:
        value: "Neues Programm"
    - action: input_number.set_value
      target:
        entity_id: input_number.gartenwasser_entwurf_v1_zeit
      data:
        value: 5
    - action: input_number.set_value
      target:
        entity_id: input_number.gartenwasser_entwurf_v2_zeit
      data:
        value: 5
    - action: input_number.set_value
      target:
        entity_id: input_number.gartenwasser_entwurf_v3_zeit
      data:
        value: 5
    - action: input_number.set_value
      target:
        entity_id: input_number.gartenwasser_entwurf_v4_zeit
      data:
        value: 5
    - action: input_number.set_value
      target:
        entity_id: input_number.gartenwasser_entwurf_v5_zeit
      data:
        value: 5
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.gartenwasser_entwurf_v1_auto
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.gartenwasser_entwurf_v2_auto
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.gartenwasser_entwurf_v3_auto
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.gartenwasser_entwurf_v4_auto
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.gartenwasser_entwurf_v5_auto
    - action: input_number.set_value
      target:
        entity_id: input_number.gartenwasser_editier_index
      data:
        value: "{{ idx }}"

# Zwei Skripte fuer das Programme-Panel auf der Plate-Settings-Seite (openHASP, page 4) -
# bewusst KEIN Entwurf/Speichern wie beim HA-Dashboard-Formular oben: die Plate schreibt
# bei jedem Tap direkt (ein Feld pro Aufruf), analog zu den Ventil-Buttons auf der
# Status-Seite. "time" bleibt sparse (nur auto=true-Ventile), exakt wie bei
# gartenwasser_programm_speichern - siehe Kommentar oben im Datei-Kopf.
gartenwasser_plate_programm_auto_toggle:
  alias: "Gartenwasser: Plate - Automatik in Programm umschalten"
  fields:
    index:
      description: "0-basierter Index des Programms im programs-Array"
      example: 0
    valve:
      description: "Ventilnummer 1-5"
      example: 1
  sequence:
    - condition: template
      value_template: "{{ index < ((state_attr('sensor.gartenwasser_programme', 'programs') or []) | count) }}"
    - variables:
        programs: "{{ state_attr('sensor.gartenwasser_programme', 'programs') }}"
        active: "{{ state_attr('sensor.gartenwasser_programme', 'activeProgram') }}"
        prog: "{{ programs[index] }}"
        new_state: "{{ not (prog.get('auto', {}) or {}).get('V' ~ valve, false) }}"
    - variables:
        new_auto: >-
          {% set ns = namespace(d={}) %}
          {% for n in range(1, 6) %}
            {% set k = 'V' ~ n %}
            {% set is_on = (new_state if n == valve else (prog.get('auto', {}) or {}).get(k, false)) %}
            {% set ns.d = dict(ns.d, **{k: is_on}) %}
          {% endfor %}
          {{ ns.d }}
        # "time" bleibt beim Deaktivieren UNVERAENDERT stehen (kein Loeschen mehr) - auto
        # allein entscheidet, ob das Ventil laeuft, "time" ist einfach "die zuletzt
        # eingestellte Dauer", genau wie im HA-Dashboard-Formular (dort bleibt der Wert
        # in den Entwurfs-Helpern erhalten, solange man nicht "Speichern" drueckt). Nur
        # beim ERSTEN Aktivieren eines Ventils ohne bisherigen Wert wird ein Default (5)
        # ergaenzt, damit die Anzeige etwas Sinnvolles zeigt.
        new_time: >-
          {%- set existing = prog.get('time', {}) or {} -%}
          {%- if new_state -%}
            {{ dict(existing, **{'V' ~ valve: existing.get('V' ~ valve, 5)}) }}
          {%- else -%}
            {{ existing }}
          {%- endif -%}
    - variables:
        new_prog:
          name: "{{ prog.get('name', '') }}"
          time: "{{ new_time }}"
          auto: "{{ new_auto }}"
        new_programs: "{{ programs[:index] + [new_prog] + programs[index + 1:] }}"
    - action: mqtt.publish
      data:
        topic: "gartenwasser/main/programs/set"
        payload: "{{ {'programs': new_programs, 'activeProgram': active} | tojson }}"

gartenwasser_plate_programm_laufzeit_setzen:
  alias: "Gartenwasser: Plate - Laufzeit in Programm setzen"
  fields:
    index:
      description: "0-basierter Index des Programms im programs-Array"
      example: 0
    valve:
      description: "Ventilnummer 1-5"
      example: 1
    value:
      description: "Neue Laufzeit in Minuten (0-180)"
      example: 5
  sequence:
    - condition: template
      value_template: "{{ index < ((state_attr('sensor.gartenwasser_programme', 'programs') or []) | count) }}"
    - variables:
        programs: "{{ state_attr('sensor.gartenwasser_programme', 'programs') }}"
        active: "{{ state_attr('sensor.gartenwasser_programme', 'activeProgram') }}"
        prog: "{{ programs[index] }}"
    # Laufzeit ist unabhaengig von AUTO editierbar (Nutzer-Entscheidung 2026-08-26) - kein
    # Guard mehr auf den Automatik-Status. Firmware akzeptiert einen "time"-Eintrag fuer
    # ein auto=false-Ventil klaglos, siehe gartenwasser_plate_programm_auto_toggle oben.
    - variables:
        new_prog:
          name: "{{ prog.get('name', '') }}"
          time: "{{ dict(prog.get('time', {}) or {}, **{'V' ~ valve: value}) }}"
          auto: "{{ prog.get('auto', {}) }}"
        new_programs: "{{ programs[:index] + [new_prog] + programs[index + 1:] }}"
    - action: mqtt.publish
      data:
        topic: "gartenwasser/main/programs/set"
        payload: "{{ {'programs': new_programs, 'activeProgram': active} | tojson }}"

# Fuenf Skripte fuer den Zeitplan-Editor (Zeitplan-Seite) - gleiches Grundmuster wie die
# Programm-Skripte oben (Bearbeiten starten/Speichern/Loeschen/Neu, plus Abbrechen), auf
# das schedule-Array statt programs-Array angewendet (main/schedule/set ersetzt ebenfalls
# immer das komplette Array, siehe docs/spec/15-wochenplan.md). Zusaetzlich ein
# Toggle-Skript fuer die schnelle Pause/Aktivierung eines Eintrags direkt aus der Liste,
# ohne das volle Formular zu oeffnen (das Feld "enabled" sitzt im Array-Objekt selbst,
# es gibt dafuer keinen einzelnen Helper wie bei den Ventil-"auto"-Flags).
#
# Wochentage per repeat/for_each statt 7x ausgeschriebenem if/then/else (anders als beim
# Programm-Editor oben) - bei 7 Tagen wird die ausgeschriebene Variante unuebersichtlich
# lang, der Loop bleibt uebersichtlich UND wartbar (ein einziger Ort fuer die 7 Tage).

gartenwasser_zeitplan_eintrag_bearbeiten_starten:
  alias: "Gartenwasser: Zeitplan-Eintrag-Bearbeitung starten"
  fields:
    index:
      description: "0-basierter Index des zu bearbeitenden Eintrags im schedule-Array"
      example: 0
  sequence:
    - variables:
        entry: "{{ state_attr('sensor.gartenwasser_zeitplan', 'schedule')[index] }}"
        type_map: {'daily': 'Taeglich', 'weekly': 'Woechentlich', 'once': 'Einmalig'}
        wd_list: "{{ entry.weekdays | default([]) }}"
        program_names: "{{ state_attr('sensor.gartenwasser_programme', 'programs') | default([]) | map(attribute='name') | list }}"
    - action: input_select.select_option
      target:
        entity_id: input_select.gartenwasser_zeitplan_entwurf_program
      data:
        # Faellt auf "Kein Programm" zurueck, wenn das referenzierte Programm
        # zwischenzeitlich umbenannt/geloescht wurde (input_select.select_option wuerde
        # sonst mit "Invalid option" abbrechen, siehe Zeitplan-Hauptseite: verwaiste
        # Eintraege werden dort orange markiert) - damit bleibt der Eintrag bearbeitbar,
        # der Nutzer kann ein gueltiges Programm neu zuweisen.
        option: "{{ entry.program if entry.program in program_names else 'Kein Programm' }}"
    - action: input_select.select_option
      target:
        entity_id: input_select.gartenwasser_zeitplan_entwurf_type
      data:
        option: "{{ type_map.get(entry.type, 'Taeglich') }}"
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.gartenwasser_zeitplan_entwurf_zeit
      data:
        time: "{{ entry.time }}:00"
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.gartenwasser_zeitplan_entwurf_datum
      data:
        date: "{{ entry.date | default(now().strftime('%Y-%m-%d'), true) }}"
    - repeat:
        for_each: ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun']
        sequence:
          - action: "{{ 'input_boolean.turn_on' if repeat.item in wd_list else 'input_boolean.turn_off' }}"
            target:
              entity_id: "input_boolean.gartenwasser_zeitplan_entwurf_{{ repeat.item }}"
    - action: input_number.set_value
      target:
        entity_id: input_number.gartenwasser_zeitplan_editier_index
      data:
        value: "{{ index }}"

gartenwasser_zeitplan_eintrag_abbrechen:
  alias: "Gartenwasser: Zeitplan-Eintrag-Bearbeitung abbrechen"
  sequence:
    - action: input_number.set_value
      target:
        entity_id: input_number.gartenwasser_zeitplan_editier_index
      data:
        value: -1

gartenwasser_zeitplan_eintrag_speichern:
  alias: "Gartenwasser: Zeitplan-Eintrag speichern"
  sequence:
    - variables:
        idx: "{{ states('input_number.gartenwasser_zeitplan_editier_index') | int }}"
        schedule: "{{ state_attr('sensor.gartenwasser_zeitplan', 'schedule') }}"
        type_map: {'Taeglich': 'daily', 'Woechentlich': 'weekly', 'Einmalig': 'once'}
        sel_type: "{{ type_map.get(states('input_select.gartenwasser_zeitplan_entwurf_type'), 'daily') }}"
    - variables:
        # "enabled" wird NICHT im Formular bearbeitet (Aktivierung/Pause laeuft
        # ausschliesslich ueber den Icon-Toggle auf der Zeitplan-Hauptseite) - beim
        # Speichern deshalb 1:1 vom bestehenden Eintrag uebernommen, bei einem neuen
        # Eintrag (idx == Array-Laenge, noch kein bestehender Wert) Default true.
        new_entry_base:
          enabled: "{{ (schedule[idx].enabled | default(true)) if idx < (schedule | count) else true }}"
          type: "{{ sel_type }}"
          time: "{{ states('input_datetime.gartenwasser_zeitplan_entwurf_zeit')[:5] }}"
          program: "{{ states('input_select.gartenwasser_zeitplan_entwurf_program') }}"
    - variables:
        new_entry: >-
          {% if sel_type == 'weekly' %}
            {% set wds = namespace(l=[]) %}
            {% for d in ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'] %}
              {% if is_state('input_boolean.gartenwasser_zeitplan_entwurf_' ~ d, 'on') %}
                {% set wds.l = wds.l + [d] %}
              {% endif %}
            {% endfor %}
            {{ dict(new_entry_base, weekdays=wds.l) }}
          {% elif sel_type == 'once' %}
            {{ dict(new_entry_base, date=states('input_datetime.gartenwasser_zeitplan_entwurf_datum')) }}
          {% else %}
            {{ new_entry_base }}
          {% endif %}
        new_schedule: "{{ schedule[:idx] + [new_entry] + schedule[idx + 1:] }}"
    - action: mqtt.publish
      data:
        topic: "gartenwasser/main/schedule/set"
        payload: "{{ {'schedule': new_schedule} | tojson }}"
    - action: input_number.set_value
      target:
        entity_id: input_number.gartenwasser_zeitplan_editier_index
      data:
        value: -1

gartenwasser_zeitplan_eintrag_loeschen:
  alias: "Gartenwasser: Zeitplan-Eintrag loeschen"
  fields:
    index:
      description: "0-basierter Index des zu loeschenden Eintrags im schedule-Array"
      example: 0
  sequence:
    - variables:
        schedule: "{{ state_attr('sensor.gartenwasser_zeitplan', 'schedule') }}"
        new_schedule: "{{ schedule[:index] + schedule[index + 1:] }}"
    - action: mqtt.publish
      data:
        topic: "gartenwasser/main/schedule/set"
        payload: "{{ {'schedule': new_schedule} | tojson }}"

gartenwasser_zeitplan_eintrag_toggle_aktiv:
  alias: "Gartenwasser: Zeitplan-Eintrag Aktiv umschalten"
  fields:
    index:
      description: "0-basierter Index des Eintrags im schedule-Array"
      example: 0
  sequence:
    - variables:
        schedule: "{{ state_attr('sensor.gartenwasser_zeitplan', 'schedule') }}"
        entry: "{{ schedule[index] }}"
        new_entry: "{{ dict(entry, enabled=not (entry.enabled | default(true))) }}"
        new_schedule: "{{ schedule[:index] + [new_entry] + schedule[index + 1:] }}"
    - action: mqtt.publish
      data:
        topic: "gartenwasser/main/schedule/set"
        payload: "{{ {'schedule': new_schedule} | tojson }}"

gartenwasser_zeitplan_eintrag_neu_starten:
  alias: "Gartenwasser: Neuen Zeitplan-Eintrag anlegen"
  sequence:
    - variables:
        idx: "{{ state_attr('sensor.gartenwasser_zeitplan', 'schedule') | count }}"
        first_program: >-
          {% set names = state_attr('sensor.gartenwasser_programme', 'programs') | default([]) | map(attribute='name') | list %}
          {{ names[0] if names else 'Kein Programm' }}
    - action: input_select.select_option
      target:
        entity_id: input_select.gartenwasser_zeitplan_entwurf_program
      data:
        option: "{{ first_program }}"
    - action: input_select.select_option
      target:
        entity_id: input_select.gartenwasser_zeitplan_entwurf_type
      data:
        option: "Taeglich"
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.gartenwasser_zeitplan_entwurf_zeit
      data:
        time: "21:00:00"
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.gartenwasser_zeitplan_entwurf_datum
      data:
        date: "{{ now().strftime('%Y-%m-%d') }}"
    - repeat:
        for_each: ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun']
        sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: "input_boolean.gartenwasser_zeitplan_entwurf_{{ repeat.item }}"
    - action: input_number.set_value
      target:
        entity_id: input_number.gartenwasser_zeitplan_editier_index
      data:
        value: "{{ idx }}"

objects:
  - obj: "p0b3"
    properties:
      "hidden": "{{ states('number.plate_wz_page_number') == '4' }}"
    event:
      "up":
        - choose:
            - conditions: "{{ text == '<' }}"
              sequence:
                - service: mqtt.publish
                  data:
                    topic: hasp/plate_wz/command/page
                    payload: "prev"
            - conditions: "{{ text == '>' }}"
              sequence:
                - service: mqtt.publish
                  data:
                    topic: hasp/plate_wz/command/page
                    payload: "next"
            - conditions: "{{ text == 'Home' }}"
              sequence:
                - service: mqtt.publish
                  data:
                    topic: hasp/plate_wz/command/page
                    payload: "1"

  - obj: "p3b15"
    event:
      "up":
        - service: mqtt.publish
          data:
            topic: hasp/plate_wz/command/page
            payload: "4"

  - obj: "p4b10"
    event:
      "up":
        - service: mqtt.publish
          data:
            topic: hasp/plate_wz/command/page
            payload: "3"

  - obj: "p4b20"
    properties:
      "border_width": "{{ 4 if is_state('input_select.gartenwasser_plate_settings_kategorie', 'Konfiguration') else 0 }}"
    event:
      "up":
        - service: input_select.select_option
          data:
            option: "Konfiguration"
          target:
            entity_id: input_select.gartenwasser_plate_settings_kategorie

  - obj: "p4b82"
    properties:
      "border_width": "{{ 4 if is_state('input_select.gartenwasser_plate_settings_kategorie', 'Programme') else 0 }}"
    event:
      "up":
        - service: input_select.select_option
          data:
            option: "Programme"
          target:
            entity_id: input_select.gartenwasser_plate_settings_kategorie

  - obj: "p4b83"
    properties:
      "border_width": "{{ 4 if is_state('input_select.gartenwasser_plate_settings_kategorie', 'Zeitplan') else 0 }}"
      "bg_color": "{{ '#43a047' if is_state('switch.gartenwasser_zeitplan_aktiv', 'on') else '#333333' }}"
      "bg_color30": "{{ '#43a047' if is_state('switch.gartenwasser_zeitplan_aktiv', 'on') else '#333333' }}"
      "bg_color40": "{{ '#43a047' if is_state('switch.gartenwasser_zeitplan_aktiv', 'on') else '#333333' }}"
    event:
      "up":
        - service: input_select.select_option
          data:
            option: "Zeitplan"
          target:
            entity_id: input_select.gartenwasser_plate_settings_kategorie
      "long":
        - service: switch.toggle
          target:
            entity_id: switch.gartenwasser_zeitplan_aktiv

  - obj: "p4b30"
    properties:
      "hidden": "{{ states('input_select.gartenwasser_plate_settings_kategorie') != 'Konfiguration' }}"
    event:
      "up":
        - service: input_number.set_value
          data:
            value: >-
              {%- set cur = states('input_number.gartenwasser_plate_settings_ventil') | int(1) -%}
              {{ 5 if cur <= 1 else cur - 1 }}
          target:
            entity_id: input_number.gartenwasser_plate_settings_ventil

  - obj: "p4b33"
    properties:
      "hidden": "{{ states('input_select.gartenwasser_plate_settings_kategorie') != 'Konfiguration' }}"
    event:
      "up":
        - service: input_number.set_value
          data:
            value: >-
              {%- set cur = states('input_number.gartenwasser_plate_settings_ventil') | int(1) -%}
              {{ 1 if cur >= 5 else cur + 1 }}
          target:
            entity_id: input_number.gartenwasser_plate_settings_ventil

  - obj: "p4b31"
    properties:
      "hidden": "{{ states('input_select.gartenwasser_plate_settings_kategorie') != 'Konfiguration' }}"
      "text": >-
        {%- set n = states('input_number.gartenwasser_plate_settings_ventil') | int(1) -%}
        {{ states('text.gartenwasser_v' ~ n ~ '_alias') }}

  - obj: "p4b32"
    properties:
      "hidden": "{{ states('input_select.gartenwasser_plate_settings_kategorie') != 'Konfiguration' }}"
      "text": >-
        {{ 'Ventil ' ~ (states('input_number.gartenwasser_plate_settings_ventil') | int(1)) }}

  - obj: "p4b34"
    properties:
      "hidden": "{{ states('input_select.gartenwasser_plate_settings_kategorie') != 'Konfiguration' }}"
    event:
      "up":
        - service: number.set_value
          data:
            value: >-
              {%- set n = states('input_number.gartenwasser_plate_settings_ventil') | int(1) -%}
              {%- set cur = states('number.gartenbewasserung_ventil_' ~ n ~ '_laufzeit') | int(0) -%}
              {{ [0, cur - 1] | max }}
          target:
            entity_id: >-
              {%- set n = states('input_number.gartenwasser_plate_settings_ventil') | int(1) -%}
              number.gartenbewasserung_ventil_{{ n }}_laufzeit

  - obj: "p4b35"
    properties:
      "hidden": "{{ states('input_select.gartenwasser_plate_settings_kategorie') != 'Konfiguration' }}"
      "text": >-
        {%- set n = states('input_number.gartenwasser_plate_settings_ventil') | int(1) -%}
        {{ states('number.gartenbewasserung_ventil_' ~ n ~ '_laufzeit') | int(0) }} Min

  - obj: "p4b36"
    properties:
      "hidden": "{{ states('input_select.gartenwasser_plate_settings_kategorie') != 'Konfiguration' }}"
    event:
      "up":
        - service: number.set_value
          data:
            value: >-
              {%- set n = states('input_number.gartenwasser_plate_settings_ventil') | int(1) -%}
              {%- set cur = states('number.gartenbewasserung_ventil_' ~ n ~ '_laufzeit') | int(0) -%}
              {{ [180, cur + 1] | min }}
          target:
            entity_id: >-
              {%- set n = states('input_number.gartenwasser_plate_settings_ventil') | int(1) -%}
              number.gartenbewasserung_ventil_{{ n }}_laufzeit

  - obj: "p4b40"
    properties:
      "hidden": "{{ states('input_select.gartenwasser_plate_settings_kategorie') != 'Programme' }}"
    event:
      "up":
        - service: input_number.set_value
          data:
            value: >-
              {%- set count = (state_attr('sensor.gartenwasser_programme', 'programs') or []) | count -%}
              {%- set cur = states('input_number.gartenwasser_plate_settings_programm') | int(0) -%}
              {{ ((cur - 1) % count) if count > 0 else 0 }}
          target:
            entity_id: input_number.gartenwasser_plate_settings_programm

  - obj: "p4b42"
    properties:
      "hidden": "{{ states('input_select.gartenwasser_plate_settings_kategorie') != 'Programme' }}"
    event:
      "up":
        - service: input_number.set_value
          data:
            value: >-
              {%- set count = (state_attr('sensor.gartenwasser_programme', 'programs') or []) | count -%}
              {%- set cur = states('input_number.gartenwasser_plate_settings_programm') | int(0) -%}
              {{ ((cur + 1) % count) if count > 0 else 0 }}
          target:
            entity_id: input_number.gartenwasser_plate_settings_programm

  - obj: "p4b41"
    properties:
      "hidden": "{{ states('input_select.gartenwasser_plate_settings_kategorie') != 'Programme' }}"
      "text": >-
        {%- set programs = state_attr('sensor.gartenwasser_programme', 'programs') or [] -%}
        {%- set idx = states('input_number.gartenwasser_plate_settings_programm') | int(0) -%}
        {{ programs[idx].get('name', '') if idx < (programs | count) else '' }}

  - obj: "p4b43"
    properties:
      "hidden": "{{ states('input_select.gartenwasser_plate_settings_kategorie') != 'Programme' }}"
    event:
      "up":
        - service: input_number.set_value
          data:
            value: >-
              {%- set cur = states('input_number.gartenwasser_plate_settings_ventil') | int(1) -%}
              {{ 5 if cur <= 1 else cur - 1 }}
          target:
            entity_id: input_number.gartenwasser_plate_settings_ventil

  - obj: "p4b45"
    properties:
      "hidden": "{{ states('input_select.gartenwasser_plate_settings_kategorie') != 'Programme' }}"
    event:
      "up":
        - service: input_number.set_value
          data:
            value: >-
              {%- set cur = states('input_number.gartenwasser_plate_settings_ventil') | int(1) -%}
              {{ 1 if cur >= 5 else cur + 1 }}
          target:
            entity_id: input_number.gartenwasser_plate_settings_ventil

  - obj: "p4b44"
    properties:
      "hidden": "{{ states('input_select.gartenwasser_plate_settings_kategorie') != 'Programme' }}"
      "text": >-
        {%- set programs = state_attr('sensor.gartenwasser_programme', 'programs') or [] -%}
        {%- set idx = states('input_number.gartenwasser_plate_settings_programm') | int(0) -%}
        {%- set n = states('input_number.gartenwasser_plate_settings_ventil') | int(1) -%}
        {%- set auto_on = programs[idx].get('auto', {}).get('V' ~ n, false) if idx < (programs | count) else false -%}
        {%- set alias = states('text.gartenwasser_v' ~ n ~ '_alias') -%}
        V{{ n }}: {{ alias }}{{ '\n' }}Automatik {{ 'AN' if auto_on else 'AUS' }}
      "bg_color": >-
        {%- set programs = state_attr('sensor.gartenwasser_programme', 'programs') or [] -%}
        {%- set idx = states('input_number.gartenwasser_plate_settings_programm') | int(0) -%}
        {%- set n = states('input_number.gartenwasser_plate_settings_ventil') | int(1) -%}
        {%- set auto_on = programs[idx].get('auto', {}).get('V' ~ n, false) if idx < (programs | count) else false -%}
        {{ '#43a047' if auto_on else '#757575' }}
      "bg_color30": >-
        {%- set programs = state_attr('sensor.gartenwasser_programme', 'programs') or [] -%}
        {%- set idx = states('input_number.gartenwasser_plate_settings_programm') | int(0) -%}
        {%- set n = states('input_number.gartenwasser_plate_settings_ventil') | int(1) -%}
        {%- set auto_on = programs[idx].get('auto', {}).get('V' ~ n, false) if idx < (programs | count) else false -%}
        {{ '#43a047' if auto_on else '#757575' }}
      "bg_color40": >-
        {%- set programs = state_attr('sensor.gartenwasser_programme', 'programs') or [] -%}
        {%- set idx = states('input_number.gartenwasser_plate_settings_programm') | int(0) -%}
        {%- set n = states('input_number.gartenwasser_plate_settings_ventil') | int(1) -%}
        {%- set auto_on = programs[idx].get('auto', {}).get('V' ~ n, false) if idx < (programs | count) else false -%}
        {{ '#43a047' if auto_on else '#757575' }}
    event:
      "up":
        - service: script.gartenwasser_plate_programm_auto_toggle
          data:
            index: "{{ states('input_number.gartenwasser_plate_settings_programm') | int(0) }}"
            valve: "{{ states('input_number.gartenwasser_plate_settings_ventil') | int(1) }}"

  - obj: "p4b46"
    properties:
      "hidden": "{{ states('input_select.gartenwasser_plate_settings_kategorie') != 'Programme' }}"
    event:
      "up":
        - service: script.gartenwasser_plate_programm_laufzeit_setzen
          data:
            index: "{{ states('input_number.gartenwasser_plate_settings_programm') | int(0) }}"
            valve: "{{ states('input_number.gartenwasser_plate_settings_ventil') | int(1) }}"
            value: >-
              {%- set programs = state_attr('sensor.gartenwasser_programme', 'programs') or [] -%}
              {%- set idx = states('input_number.gartenwasser_plate_settings_programm') | int(0) -%}
              {%- set n = states('input_number.gartenwasser_plate_settings_ventil') | int(1) -%}
              {%- set cur = ((programs[idx].get('time', {}) or {}).get('V' ~ n, 5) if idx < (programs | count) else 5) -%}
              {{ [0, cur - 1] | max }}

  - obj: "p4b47"
    properties:
      "hidden": "{{ states('input_select.gartenwasser_plate_settings_kategorie') != 'Programme' }}"
      "text": >-
        {%- set programs = state_attr('sensor.gartenwasser_programme', 'programs') or [] -%}
        {%- set idx = states('input_number.gartenwasser_plate_settings_programm') | int(0) -%}
        {%- set n = states('input_number.gartenwasser_plate_settings_ventil') | int(1) -%}
        {%- set cur = ((programs[idx].get('time', {}) or {}).get('V' ~ n, 5) if idx < (programs | count) else 5) -%}
        {{ cur }} Min

  - obj: "p4b48"
    properties:
      "hidden": "{{ states('input_select.gartenwasser_plate_settings_kategorie') != 'Programme' }}"
    event:
      "up":
        - service: script.gartenwasser_plate_programm_laufzeit_setzen
          data:
            index: "{{ states('input_number.gartenwasser_plate_settings_programm') | int(0) }}"
            valve: "{{ states('input_number.gartenwasser_plate_settings_ventil') | int(1) }}"
            value: >-
              {%- set programs = state_attr('sensor.gartenwasser_programme', 'programs') or [] -%}
              {%- set idx = states('input_number.gartenwasser_plate_settings_programm') | int(0) -%}
              {%- set n = states('input_number.gartenwasser_plate_settings_ventil') | int(1) -%}
              {%- set cur = ((programs[idx].get('time', {}) or {}).get('V' ~ n, 5) if idx < (programs | count) else 5) -%}
              {{ [180, cur + 1] | min }}

  - obj: "p3b29"
    properties:
      "bg_color": >-
        {{ '#e53935' if (is_state('sensor.gartenbewasserung_i2c_status', 'unavailable') or is_state('switch.gartenbewasserung_automatik_sequenz', 'on')) else '#333333' }}
      "bg_color30": >-
        {{ '#e53935' if (is_state('sensor.gartenbewasserung_i2c_status', 'unavailable') or is_state('switch.gartenbewasserung_automatik_sequenz', 'on')) else '#333333' }}
      "bg_color40": >-
        {{ '#e53935' if (is_state('sensor.gartenbewasserung_i2c_status', 'unavailable') or is_state('switch.gartenbewasserung_automatik_sequenz', 'on')) else '#333333' }}
      "bg_opa": >-
        {{ 180 if (is_state('sensor.gartenbewasserung_i2c_status', 'unavailable') or is_state('switch.gartenbewasserung_automatik_sequenz', 'on')) else 255 }}

  - obj: "p3b30"
    properties:
      "click": "{{ not is_state('sensor.gartenbewasserung_i2c_status', 'unavailable') }}"
    event:
      "up":
        - service: switch.toggle
          target:
            entity_id: switch.gartenbewasserung_automatik_sequenz

  - obj: "p3b31"
    properties:
      "src": "{{ 'L:/wifi_off.png' if is_state('sensor.gartenbewasserung_i2c_status', 'unavailable') else ('L:/stop.png' if is_state('switch.gartenbewasserung_automatik_sequenz', 'on') else 'L:/play.png') }}"

  - obj: "p3b32"
    properties:
      "text": "{{ 'Offline' if is_state('sensor.gartenbewasserung_i2c_status', 'unavailable') else ('Stop' if is_state('switch.gartenbewasserung_automatik_sequenz', 'on') else 'Start') }}"

  - obj: "p3b33"
    properties:
      "options": >-
        {{ (['Kein Programm'] + ((state_attr('sensor.gartenwasser_programme', 'programs') or []) | map(attribute='name') | list)) | join('\n') }}
      "val": >
        {%- set names = ['Kein Programm'] + ((state_attr('sensor.gartenwasser_programme', 'programs') or []) | map(attribute='name') | list) -%}
        {%- set current = states('input_select.gartenwasser_programm') -%}
        {{ names.index(current) if current in names else 0 }}
      "bg_color": "{{ '#e53935' if is_state('switch.gartenbewasserung_automatik_sequenz', 'on') else '#333333' }}"
      "bg_color30": "{{ '#e53935' if is_state('switch.gartenbewasserung_automatik_sequenz', 'on') else '#333333' }}"
      "bg_color40": "{{ '#e53935' if is_state('switch.gartenbewasserung_automatik_sequenz', 'on') else '#333333' }}"
      "bg_opa": "{{ 270 if is_state('switch.gartenbewasserung_automatik_sequenz', 'on') else 255 }}"
      "click": "{{ not is_state('switch.gartenbewasserung_automatik_sequenz', 'on') and not is_state('sensor.gartenbewasserung_i2c_status', 'unavailable') }}"
      "hidden": "{{ is_state('sensor.gartenbewasserung_i2c_status', 'unavailable') }}"
    event:
      "changed":
        - service: input_select.select_option
          data:
            option: "{{ text }}"
          target:
            entity_id: input_select.gartenwasser_programm

  - obj: "p3b34"
    properties:
      "text": "{{ 'Gerät nicht erreichbar' if is_state('sensor.gartenbewasserung_i2c_status', 'unavailable') else states('sensor.gartenwasser_sequenz_restzeit_text') }}"
      "hidden": "{{ is_state('input_select.gartenwasser_programm', 'Kein Programm') and not is_state('sensor.gartenbewasserung_i2c_status', 'unavailable') }}"

  - obj: "p3b40"
    properties:
      "bg_color": "{{ '#757575' if is_state('sensor.gartenbewasserung_i2c_status', 'unavailable') else ('#e53935' if is_state('binary_sensor.gartenbewasserung_hauptventil', 'on') else '#43a047') }}"
      "bg_color30": "{{ '#757575' if is_state('sensor.gartenbewasserung_i2c_status', 'unavailable') else ('#e53935' if is_state('binary_sensor.gartenbewasserung_hauptventil', 'on') else '#43a047') }}"
      "bg_color40": "{{ '#757575' if is_state('sensor.gartenbewasserung_i2c_status', 'unavailable') else ('#e53935' if is_state('binary_sensor.gartenbewasserung_hauptventil', 'on') else '#43a047') }}"

  - obj: "p3b41"
    properties:
      "bg_color": "{{ '#e53935' if is_state('switch.gartenbewasserung_ventil_1', 'on') else ('#43a047' if is_state('binary_sensor.gartenbewasserung_ventil_1_automatik', 'on') else '#757575') }}"
      "bg_color30": "{{ '#e53935' if is_state('switch.gartenbewasserung_ventil_1', 'on') else ('#43a047' if is_state('binary_sensor.gartenbewasserung_ventil_1_automatik', 'on') else '#757575') }}"
      "bg_color40": "{{ '#e53935' if is_state('switch.gartenbewasserung_ventil_1', 'on') else ('#43a047' if is_state('binary_sensor.gartenbewasserung_ventil_1_automatik', 'on') else '#757575') }}"
      "val": "{{ 1 if is_state('switch.gartenbewasserung_ventil_1', 'on') else 0 }}"
      "click": "{{ not is_state('sensor.gartenbewasserung_i2c_status', 'unavailable') }}"
    event:
      "up":
        - service: switch.toggle
          target:
            entity_id: switch.gartenbewasserung_ventil_1

  - obj: "p3b42"
    properties:
      "bg_color": "{{ '#e53935' if is_state('switch.gartenbewasserung_ventil_2', 'on') else ('#43a047' if is_state('binary_sensor.gartenbewasserung_ventil_2_automatik', 'on') else '#757575') }}"
      "bg_color30": "{{ '#e53935' if is_state('switch.gartenbewasserung_ventil_2', 'on') else ('#43a047' if is_state('binary_sensor.gartenbewasserung_ventil_2_automatik', 'on') else '#757575') }}"
      "bg_color40": "{{ '#e53935' if is_state('switch.gartenbewasserung_ventil_2', 'on') else ('#43a047' if is_state('binary_sensor.gartenbewasserung_ventil_2_automatik', 'on') else '#757575') }}"
      "val": "{{ 1 if is_state('switch.gartenbewasserung_ventil_2', 'on') else 0 }}"
      "click": "{{ not is_state('sensor.gartenbewasserung_i2c_status', 'unavailable') }}"
    event:
      "up":
        - service: switch.toggle
          target:
            entity_id: switch.gartenbewasserung_ventil_2

  - obj: "p3b43"
    properties:
      "bg_color": "{{ '#e53935' if is_state('switch.gartenbewasserung_ventil_3', 'on') else ('#43a047' if is_state('binary_sensor.gartenbewasserung_ventil_3_automatik', 'on') else '#757575') }}"
      "bg_color30": "{{ '#e53935' if is_state('switch.gartenbewasserung_ventil_3', 'on') else ('#43a047' if is_state('binary_sensor.gartenbewasserung_ventil_3_automatik', 'on') else '#757575') }}"
      "bg_color40": "{{ '#e53935' if is_state('switch.gartenbewasserung_ventil_3', 'on') else ('#43a047' if is_state('binary_sensor.gartenbewasserung_ventil_3_automatik', 'on') else '#757575') }}"
      "val": "{{ 1 if is_state('switch.gartenbewasserung_ventil_3', 'on') else 0 }}"
      "click": "{{ not is_state('sensor.gartenbewasserung_i2c_status', 'unavailable') }}"
    event:
      "up":
        - service: switch.toggle
          target:
            entity_id: switch.gartenbewasserung_ventil_3

  - obj: "p3b44"
    properties:
      "bg_color": "{{ '#e53935' if is_state('switch.gartenbewasserung_ventil_4', 'on') else ('#43a047' if is_state('binary_sensor.gartenbewasserung_ventil_4_automatik', 'on') else '#757575') }}"
      "bg_color30": "{{ '#e53935' if is_state('switch.gartenbewasserung_ventil_4', 'on') else ('#43a047' if is_state('binary_sensor.gartenbewasserung_ventil_4_automatik', 'on') else '#757575') }}"
      "bg_color40": "{{ '#e53935' if is_state('switch.gartenbewasserung_ventil_4', 'on') else ('#43a047' if is_state('binary_sensor.gartenbewasserung_ventil_4_automatik', 'on') else '#757575') }}"
      "val": "{{ 1 if is_state('switch.gartenbewasserung_ventil_4', 'on') else 0 }}"
      "click": "{{ not is_state('sensor.gartenbewasserung_i2c_status', 'unavailable') }}"
    event:
      "up":
        - service: switch.toggle
          target:
            entity_id: switch.gartenbewasserung_ventil_4

  - obj: "p3b45"
    properties:
      "bg_color": "{{ '#e53935' if is_state('switch.gartenbewasserung_ventil_5', 'on') else ('#43a047' if is_state('binary_sensor.gartenbewasserung_ventil_5_automatik', 'on') else '#757575') }}"
      "bg_color30": "{{ '#e53935' if is_state('switch.gartenbewasserung_ventil_5', 'on') else ('#43a047' if is_state('binary_sensor.gartenbewasserung_ventil_5_automatik', 'on') else '#757575') }}"
      "bg_color40": "{{ '#e53935' if is_state('switch.gartenbewasserung_ventil_5', 'on') else ('#43a047' if is_state('binary_sensor.gartenbewasserung_ventil_5_automatik', 'on') else '#757575') }}"
      "val": "{{ 1 if is_state('switch.gartenbewasserung_ventil_5', 'on') else 0 }}"
      "click": "{{ not is_state('sensor.gartenbewasserung_i2c_status', 'unavailable') }}"
    event:
      "up":
        - service: switch.toggle
          target:
            entity_id: switch.gartenbewasserung_ventil_5

  - obj: "p3b71"
    properties:
      "text": "{{ states('sensor.gartenwasser_v1_restzeit_text') }}"

  - obj: "p3b72"
    properties:
      "text": "{{ states('sensor.gartenwasser_v2_restzeit_text') }}"

  - obj: "p3b73"
    properties:
      "text": "{{ states('sensor.gartenwasser_v3_restzeit_text') }}"

  - obj: "p3b74"
    properties:
      "text": "{{ states('sensor.gartenwasser_v4_restzeit_text') }}"

  - obj: "p3b75"
    properties:
      "text": "{{ states('sensor.gartenwasser_v5_restzeit_text') }}"

  - obj: "p4b61"
    properties:
      "hidden": "{{ states('input_select.gartenwasser_plate_settings_kategorie') != 'Zeitplan' }}"
      "options": >-
        {%- set schedule = state_attr('sensor.gartenwasser_zeitplan', 'schedule') or [] -%}
        {%- set wd = {'mon': 'Mo', 'tue': 'Di', 'wed': 'Mi', 'thu': 'Do', 'fri': 'Fr', 'sat': 'Sa', 'sun': 'So'} -%}
        {%- set ns = namespace(lines=[]) -%}
        {%- for e in schedule -%}
          {%- set typ = e.get('type', 'daily') -%}
          {%- if typ == 'weekly' -%}
            {%- set wns = namespace(days=[]) -%}
            {%- for d in (e.get('weekdays', []) or []) -%}
              {%- set wns.days = wns.days + [wd.get(d, d)] -%}
            {%- endfor -%}
            {%- set when = (wns.days | join(', ')) ~ ', ' ~ e.get('time', '00:00') ~ ' Uhr' -%}
          {%- elif typ == 'once' -%}
            {%- set dp = (e.get('date', '') or '').split('-') -%}
            {%- set when = 'Einmalig ' ~ (dp[2] ~ '.' ~ dp[1] ~ '.' ~ dp[0] if dp | count == 3 else '?') ~ ', ' ~ e.get('time', '00:00') ~ ' Uhr' -%}
          {%- else -%}
            {%- set when = 'Täglich, ' ~ e.get('time', '00:00') ~ ' Uhr' -%}
          {%- endif -%}
          {%- set ns.lines = ns.lines + [e.get('program', 'Kein Programm') ~ ' - ' ~ when] -%}
        {%- endfor -%}
        {{ (ns.lines | join('\n')) if ns.lines else 'Keine Eintraege' }}
      "val": >-
        {%- set count = (state_attr('sensor.gartenwasser_zeitplan', 'schedule') or []) | count -%}
        {%- set idx = states('input_number.gartenwasser_plate_settings_zeitplan_eintrag') | int(0) -%}
        {{ idx if idx < count else 0 }}
    event:
      "changed":
        - service: input_number.set_value
          data:
            value: "{{ val }}"
          target:
            entity_id: input_number.gartenwasser_plate_settings_zeitplan_eintrag

  - obj: "p4b80"
    properties:

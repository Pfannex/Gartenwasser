objects:
  - obj: "p0b3"
    event:
      "up":
        - choose:
            - conditions: "{{ text == '<' }}"
              sequence:
                - service: mqtt.publish
                  data:
                    topic: hasp/plate_wz/command/page
                    payload: "prev"
            - conditions: "{{ text == '>' }}"
              sequence:
                - service: mqtt.publish
                  data:
                    topic: hasp/plate_wz/command/page
                    payload: "next"
            - conditions: "{{ text == 'Home' }}"
              sequence:
                - service: mqtt.publish
                  data:
                    topic: hasp/plate_wz/command/page
                    payload: "1"

  - obj: "p3b30"
    event:
      "up":
        - service: switch.toggle
          target:
            entity_id: switch.gartenbewasserung_automatik_sequenz

  - obj: "p3b31"
    properties:
      "src": "{{ 'L:/stop.png' if is_state('switch.gartenbewasserung_automatik_sequenz', 'on') else 'L:/play.png' }}"

  - obj: "p3b32"
    properties:
      "text": "{{ 'Stop' if is_state('switch.gartenbewasserung_automatik_sequenz', 'on') else 'Start' }}"

  - obj: "p3b33"
    properties:
      "options": "{{ (state_attr('sensor.gartenwasser_programme', 'programs') or []) | map(attribute='name') | join('\n') }}"
      "val": >
        {%- set names = (state_attr('sensor.gartenwasser_programme', 'programs') or []) | map(attribute='name') | list -%}
        {%- set current = states('input_select.gartenwasser_programm') -%}
        {{ names.index(current) if current in names else 0 }}
    event:
      "changed":
        - service: input_select.select_option
          data:
            option: "{{ text }}"
          target:
            entity_id: input_select.gartenwasser_programm

  - obj: "p3b34"
    properties:
      "text": >
        {%- set total = (states('sensor.gartenwasser_gesamtlaufzeit') | float(0)) * 60 -%}
        {%- if is_state('switch.gartenbewasserung_automatik_sequenz', 'on') -%}
          {%- set elapsed = (now() - states.switch.gartenbewasserung_automatik_sequenz.last_changed).total_seconds() | int -%}
        {%- else -%}
          {%- set elapsed = 0 -%}
        {%- endif -%}
        {{ '%02d:%02d' | format(elapsed // 60, elapsed % 60) }} / {{ '%02d:%02d' | format(total // 60, total % 60) }} Min.

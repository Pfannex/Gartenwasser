# Lovelace-Dashboard (YAML-Modus) - Nachbau der WebIF-Navigation (7 Tabs, docs/manual/
# images/webif-status.webp) + Programme-Auswahl (Phase 10.1/10.3).
# Einbindung: Einstellungen -> Dashboards -> "+ Dashboard hinzufuegen" -> "Neues Dashboard
# aus YAML erstellen", diesen Inhalt einfuegen. Alternativ ueber configuration.yaml als
# YAML-Dashboard registrieren (lovelace.dashboards, url_path braucht einen Bindestrich!).
#
# Entity-IDs unten sind aus der ECHTEN Entity-Registry einer laufenden Instanz uebernommen
# (core.entity_registry), nicht nur aus den HaDiscovery.cpp-"name"-Feldern geraten - Home
# Assistant haengt bei Discovery-Entities automatisch den Geraetenamen als Praefix an
# (z. B. "Ventil 1" -> switch.gartenbewasserung_ventil_1). Trotzdem vor Verwendung gegen
# die eigene Instanz pruefen (Einstellungen -> Geraete & Dienste -> Entitaeten) - bei
# Namenskollisionen kann HA einen abweichenden Suffix ("_2") vergeben.
#
# Bekannte Luecke: WebIF-Ventil-Aliase (z. B. "Sprenger Rasen") sind NICHT ueber MQTT/
# Discovery verfuegbar (kein Topic dafuer) - das Dashboard zeigt daher "Ventil 1" statt
# des Alias. Wer die Aliase im Dashboard sehen will, muss sie manuell in customize.yaml
# als friendly_name je Entity eintragen und bei Aenderung im WebIF von Hand nachpflegen.
#
# Abhaengigkeiten: mehrere Views nutzen "custom:mushroom-template-card" (HACS-Repository
# piitaya/lovelace-mushroom) - reine Bordmittel (tile/markdown) konnten weder mehrere
# Entities in einer Box kombinieren noch farbig gestylte Boxen rendern (Markdown-Karte
# filtert Inline-style per DOMPurify raus). Details/Rationale siehe README.md, Abschnitt
# "Abhaengigkeiten". Die Status-View wurde inzwischen komplett auf "custom:bubble-card"
# (HACS-Repository Clooos/Bubble-Card) umgestellt, siehe Log.md.

title: Gartenwasser
views:
  - title: Status
    path: gartenwasser-status
    icon: mdi:sprinkler-variant
    show_icon_and_title: true
    type: sections
    sections:
      - type: grid
        cards:
          - type: custom:bubble-card
            card_type: button
            card_layout: large
            rows: 2
            button_type: name
            entity: sensor.gartenwasser_sequenz_restlaufzeit_prozent
            show_state: false
            name: "Automatik"
            icon: mdi:play
            sub_button:
              - icon: mdi:playlist-check
                entity: input_select.gartenwasser_programm
                sub_button_type: select
                select_attribute: options
                show_state: true
                show_icon: false
                # Nur im Ruhezustand aenderbar - waehrend die Automatik laeuft, soll das
                # laufende Programm nicht mehr gewechselt werden koennen.
                visibility:
                  - condition: state
                    entity: switch.gartenbewasserung_automatik_sequenz
                    state: "off"
            tap_action:
              action: call-service
              service: switch.toggle
              target:
                entity_id: switch.gartenbewasserung_automatik_sequenz
            styles: |
              .bubble-main-icon-container {
                width: 96px !important;
                height: 96px !important;
              }
              .bubble-main-icon-container ha-icon {
                color: black !important;
                --mdc-icon-size: 48px !important;
              }
              .bubble-sub-button-1 .bubble-sub-button-name-container {
                font-size: 1.3em !important;
              }
              .bubble-sub-button-container {
                position: absolute !important;
                left: 114px !important;
                top: 68px !important;
                justify-content: flex-start !important;
              }
              .bubble-dropdown-arrow {
                background: var(--secondary-background-color) !important;
              }
              .bubble-sub-button-1 {
                background-color: var(--secondary-background-color) !important;
              }
              ha-select {
                --bubble-select-list-background-color: var(--secondary-background-color) !important;
              }
              .bubble-name {
                font-size: 1.6em !important;
              }
              .bubble-state {
                font-size: 1.2em !important;
                margin-top: 4px !important;
              }
              ha-card {
                --bubble-button-icon-background-color: ${hass.states['sensor.gartenbewasserung_i2c_status'].state === 'unavailable' ? '#e53935' : (hass.states['switch.gartenbewasserung_automatik_sequenz'].state === 'on' ? '#e53935' : '#43a047')} !important;
                ${hass.states['sensor.gartenbewasserung_i2c_status'].state === 'unavailable' ? '--bubble-button-main-background-color: #e53935 !important;' : ''}
              }
              ${(() => {
                const offline = hass.states['sensor.gartenbewasserung_i2c_status'].state === 'unavailable';
                const on = hass.states['switch.gartenbewasserung_automatik_sequenz'].state === 'on';
                card.querySelector('.bubble-main-icon-container ha-icon').setAttribute('icon', offline ? 'mdi:wifi-off' : (on ? 'mdi:stop' : 'mdi:play'));
                card.querySelector('.bubble-name').textContent = offline ? 'Offline' : (on ? 'STOP' : 'START');
                // Start/Stop nur bei erreichbarem Geraet erlauben - ein Toggle auf die
                // unavailable-Entity haette ohnehin keine Wirkung, aber soll erst gar
                // nicht antippbar wirken (visuell + tatsaechlich gesperrt).
                card.style.pointerEvents = offline ? 'none' : '';
              })()}
              ${(() => {
                const el = card.querySelector('.bubble-state');
                el.classList.remove('hidden');
                el.style.display = '';
                if (hass.states['sensor.gartenbewasserung_i2c_status'].state === 'unavailable') {
                  el.textContent = 'Gerät nicht erreichbar';
                  return;
                }
                const sw = hass.states['switch.gartenbewasserung_automatik_sequenz'];
                if (sw.state === 'on') {
                  const durSec = (parseFloat(hass.states['sensor.gartenwasser_gesamtlaufzeit'].state) || 0) * 60;
                  const elapsedSec = (Date.now() - new Date(sw.last_changed).getTime()) / 1000;
                  const remainingSec = Math.max(0, Math.round(durSec - elapsedSec));
                  const mm = Math.floor(remainingSec / 60);
                  const ss = remainingSec % 60;
                  el.textContent = mm + ':' + String(ss).padStart(2, '0');
                } else {
                  el.textContent = '';
                }
              })()}
              ${(() => {
                const bg = card.querySelector('.bubble-button-background');
                if (hass.states['sensor.gartenbewasserung_i2c_status'].state === 'unavailable') {
                  bg.style.background = 'transparent';
                  return;
                }
                const pct = parseFloat(hass.states['sensor.gartenwasser_sequenz_restlaufzeit_prozent'].state) || 0;
                const fill = hass.states['switch.gartenbewasserung_automatik_sequenz'].state === 'on' ? 'rgba(229, 57, 53, 0.35)' : 'transparent';
                bg.style.background = `linear-gradient(to right, ${fill} 0%, ${fill} ${pct}%, transparent ${pct}%, transparent 100%)`;
              })()}

          - type: custom:bubble-card
            card_type: button
            button_type: name
            show_state: true
            name: "Hauptventil"
            icon: mdi:valve
            grid_options:
              columns: 6
            styles: |
              .bubble-main-icon-container ha-icon {
                color: black !important;
              }
              ha-card {
                --bubble-button-icon-background-color: ${hass.states['binary_sensor.gartenbewasserung_hauptventil'].state === 'on' ? '#e53935' : '#43a047'} !important;
              }
              ${card.querySelector('.bubble-name').textContent = hass.states['text.gartenwasser_v0_alias'].state}
              ${card.querySelector('.bubble-state').textContent = hass.states['binary_sensor.gartenbewasserung_hauptventil'].state === 'on' ? 'An' : 'Aus'}

          - type: custom:bubble-card

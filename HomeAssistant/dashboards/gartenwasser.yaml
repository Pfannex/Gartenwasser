                const parts = hass.states['sensor.gartenwasser_partitionen'].attributes.partitions || [];
                const rowsHtml = parts.map(p => {
                  const sizeKb = Math.round(p.size / 1024);
                  let usedTxt = '–';
                  if (p.used !== undefined) {
                    const usedKb = Math.round(p.used / 1024);
                    const pct = Math.round((p.used / p.size) * 100);
                    usedTxt = usedKb + ' KB (' + pct + '%)';
                  }
                  const badge = p.active ? '<span style="background:#43a047;color:black;font-size:0.6rem;font-weight:700;padding:2px 7px;border-radius:8px;margin-left:8px;letter-spacing:0.03em;">AKTIV</span>' : '';
                  return `
                    <div style="display:grid; grid-template-columns:1fr 1fr 1.4fr; align-items:center; gap:8px; padding:5px 0;">
                      <span style="color:#eceef2; font-weight:600; font-size:0.82rem; display:flex; align-items:center;">${p.label}${badge}</span>
                      <span style="color:#9aa1ad; font-size:0.82rem;">${sizeKb} KB</span>
                      <span style="color:#9aa1ad; font-size:0.82rem;">${usedTxt}</span>
                    </div>
                  `;
                }).join('');
                nc.innerHTML = `
                  <div style="display:grid; grid-template-columns:1fr 1fr 1.4fr; gap:8px; padding-bottom:6px; margin-bottom:2px; border-bottom:1px solid rgba(255,255,255,0.12); font-size:0.62rem; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:#757575;">

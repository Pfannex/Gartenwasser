              {% set warn = namespace(text='') %}
              {% for n in range(1, 6) %}
                {% set laufzeit = states('number.gartenbewasserung_ventil_' ~ n ~
              '_laufzeit') | float(0) %}
                {% set maxt = states('number.gartenwasser_max_time') | float(9999) %}
                {% if laufzeit > maxt %}
                  {% set warn.text = warn.text ~ '⚠️ V' ~ n ~ ' (' ~ laufzeit | int ~
              ' min) überschreitet die Maximale Laufzeit (' ~ maxt | int ~ ' min) -
              effektive Laufzeit wird begrenzt.\n' %}
                {% endif %}
              {% endfor %}
              {{ warn.text }}
            grid_options:
              columns: full
            card_mod:
              style: |
                ha-card {
                  min-width: 500px;
                }
            visibility:
              - condition: template
                value_template: >-
                  {% set warn = namespace(found=false) %}
                  {% for n in range(1, 6) %}
                    {% set laufzeit = states('number.gartenbewasserung_ventil_' ~ n ~
                  '_laufzeit') | float(0) %}
                    {% set maxt = states('number.gartenwasser_max_time') | float(9999) %}
                    {% if laufzeit > maxt %}{% set warn.found = true %}{% endif %}
                  {% endfor %}
                  {{ warn.found }}
            # Ersatz fuer die im WebIF vorhandene Gelb-Markierung ueberschrittener
            # Laufzeiten - ein per-Zeile gefaerbter Hintergrund liess sich mit den
            # verfuegbaren Bordmitteln nicht zuverlaessig umsetzen (siehe Log.md), diese
            # Text-Warnzeile erreicht denselben Zweck zuverlaessig. Vorher blieb bei leerem
            # Inhalt eine leere, umrandete Karte sichtbar (Nutzer-Meldung) - per "visibility"
            # (gleiche Bedingung wie im Content-Template) blendet sich die Karte jetzt
            # komplett aus, wenn keine Laufzeit die Grenze ueberschreitet.


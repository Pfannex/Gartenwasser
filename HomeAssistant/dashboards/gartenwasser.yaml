  - title: Zeitplan
    path: gartenwasser-zeitplan
    icon: mdi:calendar-clock
    show_icon_and_title: true
    type: sections
    sections:
      - type: grid
        cards:
          - type: custom:bubble-card
            card_type: button
            button_type: name
            name: "Zeitplan aktiv"
            icon: mdi:calendar-check
            show_state: false
            tap_action:
              action: none
            grid_options:
              columns: full
            sub_button:
              - icon: mdi:plus
                name: "Neuer Eintrag"
                show_name: true
                tap_action:
                  action: perform-action
                  perform_action: script.gartenwasser_zeitplan_eintrag_neu_starten
                # Ausgeblendet, wenn alle 16 Slots belegt sind (kMaxScheduleEntries,
                # docs/spec/15-wochenplan.md) oder waehrend ein Eintrag bearbeitet wird.
                visibility:
                  - condition: numeric_state
                    entity: sensor.gartenwasser_zeitplan
                    below: 16
                  - condition: numeric_state
                    entity: input_number.gartenwasser_zeitplan_editier_index
                    below: 0
            styles: |
              .bubble-sub-button-1 .bubble-sub-button-icon {
                color: #43a047 !important;
              }
              ha-card {
                --bubble-button-icon-background-color: ${hass.states['switch.gartenwasser_zeitplan_aktiv'].state === 'on' ? '#43a047' : '#757575'} !important;
              }
              ${(() => {
                const icon = card.querySelector('.bubble-main-icon-container');
                if (!icon.dataset.toggleWired) {
                  icon.style.cursor = 'pointer';
                  icon.addEventListener('click', () => {
                    hass.callService('switch', 'toggle', { entity_id: 'switch.gartenwasser_zeitplan_aktiv' });
                  });
                  icon.dataset.toggleWired = '1';
                }
              })()}
            visibility:
              - condition: numeric_state
                entity: input_number.gartenwasser_zeitplan_editier_index
                below: 0

          - type: custom:bubble-card
            card_type: button
            button_type: name
            show_state: true
            name: "Eintrag 0"
            icon: mdi:calendar-clock
            card_mod:
              style: |
                ha-card {
                  min-width: 500px;
                }
            visibility:
              - condition: numeric_state
                entity: sensor.gartenwasser_zeitplan
                above: 0
              - condition: numeric_state
                entity: input_number.gartenwasser_zeitplan_editier_index
                below: 0
            sub_button:
              - icon: mdi:pencil
                tap_action:
                  action: call-service
                  service: script.gartenwasser_zeitplan_eintrag_bearbeiten_starten
                  data:
                    index: 0
              - icon: mdi:delete
                tap_action:
                  action: call-service
                  service: script.gartenwasser_zeitplan_eintrag_loeschen
                  data:
                    index: 0
                  confirmation:
                    text: "Eintrag wirklich löschen?"
            styles: |
              .bubble-sub-button-2 .bubble-sub-button-icon {
                color: red !important;
              }
              ha-card {
                ${(() => {
                  const entry = (hass.states['sensor.gartenwasser_zeitplan'].attributes.schedule || [])[0];
                  if (!entry) return '';
                  const names = (hass.states['sensor.gartenwasser_programme'].attributes.programs || []).map(p => p.name);
                  if (!names.includes(entry.program)) {
                    return '--bubble-button-main-background-color: #ffb74d !important; --bubble-button-icon-background-color: #757575 !important;';
                  }
                  const on = entry.enabled ?? true;
                  return '--bubble-button-icon-background-color: ' + (on ? '#43a047' : '#757575') + ' !important;';
                })()}
              }
              ${(() => {
                const entry = (hass.states['sensor.gartenwasser_zeitplan'].attributes.schedule || [])[0];
                if (!entry) return '';
                const names = (hass.states['sensor.gartenwasser_programme'].attributes.programs || []).map(p => p.name);
                const missing = !names.includes(entry.program);
                const wd = {mon:'Mo',tue:'Di',wed:'Mi',thu:'Do',fri:'Fr',sat:'Sa',sun:'So'};
                let when = '';
                if (entry.type === 'daily') when = 'Täglich, ' + entry.time + ' Uhr';
                else if (entry.type === 'weekly') when = (entry.weekdays || []).map(d => wd[d] || d).join(', ') + ', ' + entry.time + ' Uhr';
                else if (entry.type === 'once') { const p = (entry.date || '').split('-'); when = 'Einmalig ' + p[2] + '.' + p[1] + '.' + p[0] + ', ' + entry.time + ' Uhr'; }
                card.querySelector('.bubble-name').textContent = entry.program;
                const stateEl = card.querySelector('.bubble-state');
                stateEl.textContent = missing ? ('Programm nicht gefunden! · ' + when) : when;
                stateEl.style.color = missing ? 'black' : '';
                const icon = card.querySelector('.bubble-main-icon-container');
                icon.style.cursor = missing ? 'default' : 'pointer';
                icon.dataset.disabled = missing ? '1' : '0';
                if (!icon.dataset.toggleWired) {
                  icon.addEventListener('click', () => {
                    if (icon.dataset.disabled === '1') return;
                    hass.callService('script', 'gartenwasser_zeitplan_eintrag_toggle_aktiv', { index: 0 });
                  });
                  icon.dataset.toggleWired = '1';
                }
              })()}


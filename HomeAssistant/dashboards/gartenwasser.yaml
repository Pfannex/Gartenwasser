                  ? hass.states['sensor.gartenbewasserung_ventil_2_restlaufzeit'].state + ' min'
                  : hass.states['number.gartenbewasserung_ventil_2_laufzeit'].state + ' min';
              })()}
              ${(() => {
                const pct = parseFloat(hass.states['sensor.gartenwasser_v2_restlaufzeit_prozent'].state) || 0;
                const fill = hass.states['switch.gartenbewasserung_ventil_2'].state === 'on' ? 'rgba(229, 57, 53, 0.35)' : 'transparent';
                const bg = card.querySelector('.bubble-button-background');
                bg.style.background = `linear-gradient(to right, ${fill} 0%, ${fill} ${pct}%, transparent ${pct}%, transparent 100%)`;
              })()}

          - type: custom:bubble-card
            card_type: button
            button_type: name
            entity: sensor.gartenwasser_v3_restlaufzeit_prozent
            show_state: false
            name: "V3"
            icon: mdi:sprinkler-variant
            grid_options:

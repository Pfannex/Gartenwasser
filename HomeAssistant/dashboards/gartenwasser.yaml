          - type: custom:bubble-card
            card_type: button
            button_type: name
            name: "Programm"
            icon: mdi:playlist-edit
            show_name: false
            show_state: false
            grid_options:
              columns: full
            tap_action:
              action: none
            sub_button:
              - icon: mdi:content-save
                tap_action:
                  action: perform-action
                  perform_action: script.gartenwasser_programm_speichern
              - icon: mdi:close
                tap_action:
                  action: perform-action
                  perform_action: script.gartenwasser_programm_abbrechen
            styles: |
              .bubble-main-icon-container {
                display: none !important;
              }
              .bubble-sub-button-1 .bubble-sub-button-icon {
                color: #43a047 !important;
              }
              .bubble-sub-button-2 .bubble-sub-button-icon {
                color: #757575 !important;
              }
            visibility:
              - condition: numeric_state
                entity: input_number.gartenwasser_editier_index
                above: -1

          # Bubble-Card-Programmliste - nutzt dieselben Skripte/Helper wie das
          # Bearbeiten-Formular oben. Bubble Card unterstuetzt KEINE Jinja-Templates (nur
          # JS-Templates in styles:, siehe https://github.com/Clooos/Bubble-Card) -
          # dynamischer Name/Ventil-Text und Aktivieren-/Aktiv-Einfaerbung laufen deshalb
          # ueber ${...}-JS-Ausdruecke mit Zugriff auf `hass`/`card`.
          - type: custom:bubble-card
            card_type: button
            button_type: name
            show_state: true
            name: "Programm 0"
            icon: mdi:playlist-play
            card_mod:
              style: |
                ha-card {
                  min-width: 500px;
                }
            visibility:
              - condition: numeric_state
                entity: sensor.gartenwasser_programme
                above: 0
              - condition: numeric_state
                entity: input_number.gartenwasser_editier_index
                below: 0
            sub_button:
              - icon: mdi:play
                name: "Aktivieren"
                show_name: true
                tap_action:
                  action: call-service
                  service: mqtt.publish
                  data:
                    topic: "gartenwasser/main/program/cmd"
                    payload: "1"
                visibility:
                  - condition: template
                    value_template: "{{ state_attr('sensor.gartenwasser_programme', 'activeProgram') | int(0) != 1 }}"
              - icon: mdi:pencil
                tap_action:
                  action: call-service
                  service: script.gartenwasser_programm_bearbeiten_starten
                  data:
                    index: 0
              - icon: mdi:delete
                tap_action:
                  action: call-service
                  service: script.gartenwasser_programm_loeschen
                  data:
                    index: 0
                  confirmation:
                    text: "Programm wirklich löschen?"
            styles: |
              .bubble-sub-button-1 .bubble-sub-button-icon {
                color: ${hass.states['sensor.gartenwasser_programme'].attributes.activeProgram == 1 ? 'grey' : 'green'} !important;
              }
              .bubble-sub-button-3 .bubble-sub-button-icon {
                color: red !important;
              }
              ha-card {
                ${hass.states['sensor.gartenwasser_programme'].attributes.activeProgram == 1 ? '--bubble-button-main-background-color: #43a047 !important;' : ''}
              }
              ${card.querySelector('.bubble-name').textContent = hass.states['sensor.gartenwasser_programme'].attributes.programs[0]?.name || ''}
              ${card.querySelector('.bubble-state').textContent = (() => {
                const prog = hass.states['sensor.gartenwasser_programme'].attributes.programs[0];
                if (!prog) return '';
                const parts = [];
                for (let n = 1; n <= 5; n++) {
                  if (prog.auto['V' + n]) parts.push('V' + n + ' ' + (prog.time['V' + n] || 0) + 'min');
                }
                return parts.length ? parts.join(', ') : 'keine Ventile';
              })()}

          - type: custom:bubble-card
            card_type: button
            button_type: name
            show_state: true
            name: "Programm 1"
            icon: mdi:playlist-play
            card_mod:
              style: |
                ha-card {
                  min-width: 500px;
                }
            visibility:
              - condition: numeric_state
                entity: sensor.gartenwasser_programme
                above: 1
              - condition: numeric_state
                entity: input_number.gartenwasser_editier_index
                below: 0
            sub_button:
              - icon: mdi:play
                name: "Aktivieren"
                show_name: true
                tap_action:
                  action: call-service
                  service: mqtt.publish
                  data:
                    topic: "gartenwasser/main/program/cmd"
                    payload: "2"
                visibility:
                  - condition: template
                    value_template: "{{ state_attr('sensor.gartenwasser_programme', 'activeProgram') | int(0) != 2 }}"
              - icon: mdi:pencil
                tap_action:
                  action: call-service

                const fill = hass.states['switch.gartenbewasserung_ventil_1'].state === 'on' ? 'rgba(229, 57, 53, 0.35)' : 'transparent';
                const bg = card.querySelector('.bubble-button-background');
                bg.style.background = `linear-gradient(to right, ${fill} 0%, ${fill} ${pct}%, transparent ${pct}%, transparent 100%)`;
              })()}

          - type: custom:bubble-card
            card_type: button
            button_type: name
            entity: sensor.gartenwasser_v2_restlaufzeit_prozent
            show_state: false
            name: "V2"
            icon: mdi:sprinkler-variant
            grid_options:

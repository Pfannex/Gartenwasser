          - type: custom:bubble-card
            card_type: button
            button_type: name
            name: "Diagnose"
            icon: mdi:information
            sub_button:
              - icon: mdi:lan-connect
                show_state: false
                show_name: false
                show_icon: true
              - icon: mdi:chip
                entity: sensor.gartenbewasserung_i2c_status
                show_state: false
                show_name: true
                show_icon: false
                name: I2C
              - icon: mdi:memory
                entity: sensor.gartenwasser_ram
                show_state: true
                show_name: true
                show_icon: false
                name: RAM
              - icon: mdi:harddisk
                entity: sensor.gartenwasser_flash
                show_state: true
                show_name: true
                show_icon: false
                name: Flash
            styles: |
              .bubble-name {
                display: none !important;
              }
              .bubble-sub-button-1 {
                flex: 0 0 auto !important;
                background-color: ${hass.states['sensor.gartenbewasserung_i2c_status'].state !== 'unavailable' ? '#43a047' : '#e53935'} !important;
              }
              .bubble-sub-button-2 {
                background-color: ${hass.states['sensor.gartenbewasserung_i2c_status'].state === 'ok' ? '#43a047' : '#e53935'} !important;
              }
              .bubble-sub-button-container {
                position: absolute !important;
                left: 62px !important;
                top: 10px !important;
                right: 8px !important;
                justify-content: flex-start !important;
                gap: 6px !important;
              }
              .bubble-sub-button-3, .bubble-sub-button-4 {
                flex: 1 !important;
                justify-content: center !important;
              }
              ${(() => {
                const parsePct = (s) => {
                  const m = s.match(/(\d+)%/);
                  return m ? parseFloat(m[1]) : 0;
                };
                // Einfarbiger Fuellstand statt Farbverlauf (Nutzer-Entscheidung nach zwei
                // Gradient-Bugs: Stopp-Reihenfolge bei pct < 50 UND der Fuellstand endete
                // immer in Rot, egal wie niedrig der Wert war - beides mit einer festen
                // Farbe strukturell ausgeschlossen). Farbe per Vergleichsseite ausgewaehlt.
                const gradFill = (pct) => `linear-gradient(to right, #607d8b 0%, #607d8b ${pct}%, transparent ${pct}%, transparent 100%)`;
                const ramPct = parsePct(hass.states['sensor.gartenwasser_ram'].state);
                const flashPct = parsePct(hass.states['sensor.gartenwasser_flash'].state);
                card.querySelector('.bubble-sub-button-3').style.background = gradFill(ramPct);
                card.querySelector('.bubble-sub-button-4').style.background = gradFill(flashPct);
                // Kombinierter Name+Zustand-Text ("RAM · 74% (184/247 KB)") ist auf schmalen
                // Bildschirmen zu lang (Flash-Button wurde abgeschnitten) - auf Kurzform kuerzen.
                card.querySelector('.bubble-sub-button-3 .bubble-sub-button-name-container').textContent = 'RAM ' + ramPct + '%';
                card.querySelector('.bubble-sub-button-4 .bubble-sub-button-name-container').textContent = 'Flash ' + flashPct + '%';
              })()}

          # Fusszeile nach WebIF-Vorbild (docs/manual/images) - "Gartenbewaesserung" und
          # das Copyright sind bewusst statischer Text (kein passendes MQTT-Topic dafuer),
          # nur die Firmware-Version in der Mitte ist live aus diagnostics/version.
          - type: markdown
            content: >-
              Gartenbewässerung&nbsp;&nbsp;&nbsp;|&nbsp;&nbsp;&nbsp;{{
              states('sensor.gartenwasser_firmware') }}&nbsp;&nbsp;&nbsp;|&nbsp;&nbsp;&nbsp;©
              by Pfanne/26
            grid_options:
              columns: full
            card_mod:
              style: |
                ha-card {
                  text-align: center;
                }

  - title: Konfiguration
    path: gartenwasser-konfiguration
    icon: mdi:cog-outline
    show_icon_and_title: true
    type: sections
    sections:
      - type: grid
        cards:
          # --- Globale Einstellungen (Bubble Card, siehe Log.md fuer die Mockup-Iteration) ---
          - type: markdown
            content: |
              ##### Globale Einstellungen
              Harte Obergrenze pro Ventil, überschreitet eine Laufzeit dieses Limit, schaltet es automatisch ab.
            grid_options:
              columns: full
            card_mod:
              style:
                .: |
                  ha-card {
                    min-width: 500px;
                    background: transparent !important;
                    box-shadow: none !important;
                    border: none !important;
                  }
                ha-markdown$: |
                  h5 {
                    font-size: 0.78rem;
                    font-weight: 700;
                    text-transform: uppercase;
                    letter-spacing: 0.06em;
                    color: var(--secondary-text-color);
                    margin: 0 0 6px;
                  }
                  p {
                    font-size: 0.78rem;
                    color: var(--secondary-text-color);
                    margin: 0;
                  }
            # h5/p liegen im SHADOW ROOT von <ha-markdown> (eigenes Custom Element, siehe
            # Log.md) - ein normaler card_mod "style: |"-String scoped nur auf ha-card selbst
            # und erreicht diese Tags NICHT. Erst durch die "ha-markdown$:"-Syntax (card_mod
            # piercing) wirkt das CSS tatsaechlich - vorher blieb text-transform etc. wirkungslos.

          - type: custom:bubble-card
            card_type: button
            button_type: name
            entity: number.gartenwasser_max_time
            icon: mdi:clock-outline
            name: "Maximale Laufzeit"
            show_name: false
            show_state: false
            card_mod:
              style: |
                ha-card {
                  min-width: 500px;
                }
            styles: |
              .bubble-wrapper {
                box-sizing: border-box !important;
                padding: 0 8px !important;
                gap: 12px !important;
                align-items: center !important;
              }
              .bubble-buttons-container {
                display: none !important;
              }
              .bubble-main-icon-container {
                width: 36px !important;
                height: 36px !important;
                min-width: 36px !important;
                min-height: 36px !important;
                margin: 0 !important;
              }
              .bubble-main-icon-container ha-icon {
                color: black !important;
                --mdc-icon-size: 20px !important;
              }
              ha-card {
                --row-height: 72px !important;
                --bubble-button-icon-background-color: #607d8b !important;
              }
              ${(() => {
                const nc = card.querySelector('.bubble-name-container');
                let input = nc.querySelector('input.slider-range');
                if (!input) {
                  nc.style.cssText = 'flex:1 1 auto; margin:0; pointer-events:auto; display:flex; flex-direction:column; gap:5px;';
                  nc.innerHTML = `
                    <style>.slider-range::-webkit-slider-thumb{-webkit-appearance:none;width:0;height:36px;}
                    .slider-range::-moz-range-thumb{width:0;height:36px;border:none;background:transparent;}</style>
                    <div style="font-size:0.68rem;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;color:#9aa1ad;">Maximale Laufzeit</div>
                    <div class="slider-field" style="position:relative;height:36px;border-radius:18px;background:#282828;display:flex;align-items:center;overflow:hidden;">
                      <div class="slider-fill" style="position:absolute;left:0;top:0;bottom:0;background:#607d8b;border-radius:18px 0 0 18px;pointer-events:none;"></div>

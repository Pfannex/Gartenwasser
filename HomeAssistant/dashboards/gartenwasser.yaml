              .bubble-main-icon-container {
                display: none !important;
              }
              ha-card {
                --row-height: 150px !important;
                --bubble-button-border-radius: 16px !important;
              }
              ${(() => {
                const nc = card.querySelector('.bubble-name-container');
                nc.style.cssText = 'flex:1 1 auto; margin:0; padding:10px 12px; display:flex; flex-direction:column; justify-content:center; gap:9px;';

                const rows = [
                  ['Version', hass.states['sensor.gartenwasser_firmware'].state],
                  ['Uptime', (() => {
                    const upSec = parseInt(hass.states['sensor.gartenwasser_uptime'].state) || 0;
                    const d = Math.floor(upSec / 86400);
                    const h = Math.floor((upSec % 86400) / 3600);
                    const m = Math.floor((upSec % 3600) / 60);
                    const boot = new Date(Date.now() - upSec * 1000);
                    const pad = n => String(n).padStart(2, '0');
                    const dateStr = pad(boot.getDate()) + '/' + pad(boot.getMonth() + 1) + '/' + String(boot.getFullYear()).slice(-2);
                    const timeStr = pad(boot.getHours()) + ':' + pad(boot.getMinutes());
                    return pad(d) + 'd:' + pad(h) + 'h:' + pad(m) + 'm seit ' + dateStr + ' | ' + timeStr;
                  })()],
                  ['Letzter Neustart', hass.states['sensor.gartenwasser_reset_grund'].state],
                ];
                nc.innerHTML = rows.map(([label, value]) => `
                  <div style="display:flex; justify-content:space-between; align-items:center; gap:12px;">
                    <span style="color:#9aa1ad; font-size:0.86rem;">${label}</span>
                    <span style="color:#eceef2; font-weight:600; font-size:0.86rem; text-align:right;">${value}</span>
                  </div>
                `).join('');

              })()}

